[package]
name = "bradflix"
version = "0.2.0"
edition = "2021"
description = "BradFlix: a cinematic Stremio add-on client for Linux with its own native window. Rust, mpv for playback."

[dependencies]
tiny_http = "0.12"
serde_json = "1"
# Native window and built-in web view (the same pieces Tauri apps use).
tao = "0.30"
wry = "0.47"

[profile.release]
opt-level = 3
strip = true
