name: Linux build

on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
      - '.github/workflows/linux-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-build:
    name: Build BradFlix for Linux x86_64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
      - name: Set build version
        env:
          BUILD_VERSION: 0.2.${{ github.run_number }}
        run: sed -i -E "s/^version = \"[0-9]+\.[0-9]+\.[0-9]+\"/version = \"$BUILD_VERSION\"/" legacy-linux/Cargo.toml
      - name: Build Linux app
        run: cargo build --release
      - name: Prepare Linux update files
        run: |
          mkdir -p "$RUNNER_TEMP/bradflix-linux"
          cp target/release/bradflix "$RUNNER_TEMP/bradflix-linux/bradflix-linux-x86_64"
          cd "$RUNNER_TEMP/bradflix-linux"
          sha256sum bradflix-linux-x86_64 > bradflix-linux-x86_64.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: bradflix-linux-x86_64
          path: |
            ${{ runner.temp }}/bradflix-linux/bradflix-linux-x86_64
            ${{ runner.temp }}/bradflix-linux/bradflix-linux-x86_64.sha256
          if-no-files-found: error
          retention-days: 30
