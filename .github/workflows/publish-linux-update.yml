name: Publish Linux update

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Linux build run ID containing the Linux x86_64 app
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish:
    name: Publish selected successful Linux build
    runs-on: ubuntu-24.04
    steps:
      - name: Validate selected Linux build
        id: selected
        env:
          GH_TOKEN: ${{ github.token }}
          SELECTED_RUN_ID: ${{ inputs.run_id }}
        run: |
          if ! [[ "$SELECTED_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "Enter the numeric run ID from the Linux build URL."
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SELECTED_RUN_ID" > "$RUNNER_TEMP/selected-run.json"
          jq -e '.status == "completed" and .conclusion == "success" and .head_branch == "main" and .name == "Linux build"' "$RUNNER_TEMP/selected-run.json" >/dev/null
          run_number=$(jq -r '.run_number' "$RUNNER_TEMP/selected-run.json")
          head_sha=$(jq -r '.head_sha' "$RUNNER_TEMP/selected-run.json")
          echo "version=0.2.$run_number" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          artifact_count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SELECTED_RUN_ID/artifacts" --jq '[.artifacts[] | select(.name == "bradflix-linux-x86_64" and .expired == false)] | length')
          if [ "$artifact_count" -lt 1 ]; then
            echo "That successful Linux build has no Linux update artifact."
            exit 1
          fi
      - name: Download selected Linux build artifact
        env:
          GH_TOKEN: ${{ github.token }}
          SELECTED_RUN_ID: ${{ inputs.run_id }}
        run: gh run download "$SELECTED_RUN_ID" --repo "$GITHUB_REPOSITORY" --name bradflix-linux-x86_64 --dir "$RUNNER_TEMP/bradflix-linux"
      - name: Publish Linux GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.selected.outputs.version }}
          BUILD_SHA: ${{ steps.selected.outputs.head_sha }}
        run: |
          gh release create "linux-v$VERSION" \
            "$RUNNER_TEMP/bradflix-linux/bradflix-linux-x86_64" \
            "$RUNNER_TEMP/bradflix-linux/bradflix-linux-x86_64.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$BUILD_SHA" \
            --title "BradFlix Linux $VERSION" \
            --notes "Linux x86_64 update selected from a successful Linux build on main."
