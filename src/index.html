<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BradsHub</title>
<style>
  :root {
    --bg: #0d0f13;
    --panel: #171a21;
    --panel-hi: #222733;
    --line: #2a303c;
    --text: #eef0f4;
    --muted: #98a0b0;
    --accent: #ff4d5e;
    --accent-ink: #1a0508;
    --bad: #ff8b8b;
    --good: #7fdcb0;
    --radius: 12px;
    --side: 224px;
  }
  body[data-layout="rail"] { --side: 78px; }
  body[data-layout="top"] { --side: 0px; }
  body[data-cards="square"] { --radius: 3px; }

  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0; color: var(--text); background: var(--bg);
    font: 16px/1.5 "Noto Sans", "Cantarell", system-ui, sans-serif;
  }
  a { color: inherit; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  ::-webkit-scrollbar { height: 8px; width: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }

  /* ---------- sidebar ---------- */
  #side {
    position: fixed; left: 0; top: 0; bottom: 0; width: var(--side); z-index: 10;
    display: flex; flex-direction: column; gap: 4px; padding: 22px 12px 16px;
    background: linear-gradient(180deg, rgba(255,255,255,.035), transparent 40%), var(--bg);
    border-right: 1px solid var(--line);
  }
  body.locked #side { display: none; }
  body.locked main { margin-left: 0; }
  .brand {
    display:flex; align-items:center; width:max-content; gap:0; padding:0 12px 18px;
    color:#fff !important; background:transparent; border-radius:0; letter-spacing:-.055em;
    font:850 24px/1.1 "Noto Sans","Cantarell",system-ui,sans-serif; text-shadow:none; transform:none;
  }
  .brand-main { color:#fff; }
  .brand-badge, .intro-name b {
    display:inline-block; margin-left:.12em; padding:.08em .3em .12em; border-radius:.22em;
    color:#17120a; background:#ff9d00; letter-spacing:-.045em; font-weight:900;
  }
  .intro-name span, .brand-intro-mark span { color:#fff; }
  .brand-intro-mark b { color:#17120a; background:#ff9d00; padding:.08em .3em .12em; border-radius:.22em; }
  .intro-name { display:flex; align-items:center; gap:.04em; color:#fff; font-family:"Noto Sans","Cantarell",system-ui,sans-serif; font-size:clamp(48px,12vw,148px); font-weight:900; letter-spacing:-.06em; text-shadow:none; transform:none; }
  .intro-name b { font-size:.72em; line-height:1.05; }
  /* Keep the BradsHub wordmark branded even when a Harbor theme is imported. */
  #side .brand { color: #fff !important; font-weight: 850 !important; }
  body[data-layout="rail"] .brand { font-size: 15px; letter-spacing: -.07em; }
  #nav button[data-go="calendar"] { color: var(--muted); }
  .release-day { margin: 20px 0 28px; }
  .release-date { color: var(--accent); font-weight: 800; border-bottom: 1px solid var(--line); padding-bottom: 8px; margin-bottom: 12px; }
  .release-item { display:flex; gap:14px; align-items:center; padding:12px 0; border-bottom:1px solid var(--line); }
  .release-item img { width:64px; height:88px; object-fit:cover; border-radius:var(--radius); background:var(--panel); }
  .release-item .grow { flex:1; min-width:0; }
  body[data-theme="apple-tv"] { --bg:#000; --panel:#0d0d0d; --panel-hi:#1c1c1e; --line:#333; --text:#fff; --muted:#a1a1a6; --accent:#fff; --accent-ink:#000; }

  #nav { display: flex; flex-direction: column; gap: 3px; flex: 1; }
  #nav button {
    display: flex; align-items: center; gap: 14px; background: none; border: 0; text-align: left;
    padding: 11px 14px; border-radius: 10px; color: var(--muted); font-weight: 600;
  }
  #nav button svg { flex: 0 0 22px; }
  #nav button:hover { color: var(--text); background: var(--panel); }
  #nav button.on { color: var(--text); background: var(--panel-hi); box-shadow: inset 3px 0 0 var(--accent); }
  #nav button.on svg { color: var(--accent); }
  #chip {
    display: flex; align-items: center; gap: 10px; background: none; border: 0;
    padding: 8px 10px; border-radius: 10px; color: var(--muted); font-weight: 600; text-align: left;
  }
  #chip:hover { background: var(--panel); color: var(--text); }
  body[data-layout="rail"] .lbl, body[data-layout="rail"] #chip span { display: none; }
  body[data-layout="rail"] .brand { font-size: 15px; padding: 0 0 16px; text-align: center; }
  body[data-layout="rail"] #nav button { justify-content: center; padding: 12px 0; }

  body[data-layout="top"] #side {
    position: sticky; top: 0; width: auto; flex-direction: row; align-items: center; gap: 18px;
    padding: 8px 24px; border-right: 0; border-bottom: 1px solid var(--line); background: var(--bg);
  }
  body[data-layout="top"] .brand { padding: 0; }
  body[data-layout="top"] #nav { flex-direction: row; flex-wrap: wrap; }
  body[data-layout="top"] #nav button { padding: 8px 12px; }
  body[data-layout="top"] #nav button.on { box-shadow: inset 0 -3px 0 var(--accent); }

  main { margin-left: var(--side); padding: 28px 32px 90px; min-height: 100vh; }
  body[data-layout="top"] main { margin-left: 0; }
  h2 { font-size: 22px; margin: 0 0 14px; letter-spacing: -0.01em; }
  h3 { font-size: 17px; margin: 24px 0 10px; }
  .muted { color: var(--muted); }
  .row { margin-bottom: 34px; }
  .railwrap { position: relative; }
  .scroller { display: flex; gap: 16px; overflow-x: auto; padding: 4px 2px 12px; scroll-snap-type: x proximity; scroll-behavior: smooth; }
  .arrow {
    position: absolute; top: 0; bottom: 12px; width: 44px; border: 0; z-index: 3; font-size: 30px;
    background: linear-gradient(90deg, var(--bg), transparent); color: var(--text); opacity: 0; transition: opacity .2s;
  }
  .arrow.r { right: 0; background: linear-gradient(270deg, var(--bg), transparent); }
  .arrow.l { left: 0; }
  .railwrap:hover .arrow { opacity: 1; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, 150px); gap: 22px 16px; }

  /* ---------- cards ---------- */
  .cardwrap { flex: 0 0 150px; position: relative; scroll-snap-align: start; }
  .card { width: 150px; background: none; border: 0; padding: 0; text-align: left; display: block; }
  .card .pw { position: relative; width: 150px; height: 225px; border-radius: var(--radius); overflow: hidden; background: var(--panel); transition: transform .18s, box-shadow .18s; }
  .card .poster { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card .poster.ph { display: grid; place-items: center; font-size: 48px; color: var(--muted); }
  .card:hover .pw { transform: translateY(-4px) scale(1.03); box-shadow: 0 10px 28px rgba(0,0,0,.55), 0 0 0 2px var(--accent); }
  .card .name {
    margin-top: 8px; font-size: 14px; line-height: 1.3;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .card .sub { font-size: 12px; color: var(--muted); }
  .cardwrap.wide { flex-basis: 288px; }
  .card.wide, .card.wide .pw { width: 288px; }
  .card.wide .pw { height: 162px; }
  .cardwrap.top10 { flex-basis: 212px; display: flex; align-items: flex-end; gap: 4px; }
  .cardwrap.top10 .num {
    display: block; flex: 0 0 78px; width: 78px; text-align: center;
    font-size: 128px; font-weight: 900; line-height: .78; margin: 0; z-index: 0; letter-spacing: -0.08em;
    color: var(--bg); -webkit-text-stroke: 3px var(--muted); user-select: none;
  }
  .cardwrap.top10 .num.double { font-size: 100px; }
  .card.top10, .card.top10 .pw { width: 130px; z-index: 1; }
  .card.top10 { flex: 0 0 130px; }
  .card.top10 .pw { height: 195px; }
  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 5px; background: rgba(0,0,0,.65); }
  .bar i { display: block; height: 100%; background: var(--accent); }
  .x {
    position: absolute; top: 6px; right: 6px; width: 28px; height: 28px; border-radius: 50%;
    border: 0; background: rgba(13,15,19,.85); font-size: 13px;
  }
  .x:hover { background: var(--bad); color: #2a0b0b; }

  /* ---------- hero ---------- */
  .hero {
    position: relative; height: min(64vh, 580px); min-height: 380px; margin: -28px -32px 30px; overflow: hidden;
    border-radius: 0 0 var(--radius) var(--radius); background: var(--panel);
  }
  body[data-layout="top"] .hero { margin-top: -28px; }
  .hero .slide {
    position: absolute; inset: 0; opacity: 0; transition: opacity 1s ease;
    background-size: cover; background-position: center 18%;
  }
  .hero .slide.on { opacity: 1; }
  .hshade {
    position: absolute; inset: 0;
    background: linear-gradient(90deg, rgba(0,0,0,.82) 0%, rgba(0,0,0,.4) 45%, transparent 75%),
                linear-gradient(0deg, var(--bg) 0%, transparent 38%);
  }
  .hbody { position: absolute; left: 48px; bottom: 64px; max-width: 580px; z-index: 2; }
  .hbody .kicker { color: var(--accent); font-weight: 800; letter-spacing: .12em; font-size: 12px; text-transform: uppercase; }
  .hbody h1 { margin: 6px 0 8px; font-size: clamp(30px, 4.4vw, 54px); line-height: 1.04; letter-spacing: -0.03em; text-shadow: 0 2px 24px rgba(0,0,0,.6); }
  .hbody .meta { color: #d6dae3; margin-bottom: 10px; font-weight: 600; }
  .hbody p { margin: 0 0 18px; color: #dde1ea; max-width: 52ch; text-shadow: 0 1px 12px rgba(0,0,0,.7); }
  .dots { position: absolute; right: 36px; bottom: 30px; display: flex; gap: 8px; z-index: 3; }
  .dots button { width: 10px; height: 10px; padding: 0; border-radius: 50%; border: 0; background: rgba(255,255,255,.35); }
  .dots button.on { background: var(--accent); width: 26px; border-radius: 6px; }

  /* ---------- buttons, inputs ---------- */
  .filters, .searchbar { display: flex; gap: 10px; margin-bottom: 22px; flex-wrap: wrap; align-items: center; }
  .searchbar { max-width: 680px; }
  .search-wrap { position:relative; max-width:680px; z-index:4; }
  .search-suggestions { position:absolute; top:calc(100% - 18px); left:0; right:0; max-height:min(52vh,420px); overflow:auto; padding:6px; border:1px solid var(--line); border-radius:12px; background:var(--panel); box-shadow:0 14px 34px rgba(0,0,0,.42); }
  .search-suggestions[hidden] { display:none; }
  .search-suggestions button { width:100%; display:flex; align-items:center; gap:12px; text-align:left; padding:10px 12px; border:0; border-radius:8px; color:var(--text); background:transparent; cursor:pointer; }
  .search-suggestions button:hover, .search-suggestions button:focus-visible { background:var(--panel-hi); outline:2px solid var(--accent); }
  .search-suggestions img { width:38px; height:56px; object-fit:cover; border-radius:5px; }
  .search-suggestions .suggestion-copy { min-width:0; }
  .search-suggestions .suggestion-title { font-weight:700; }
  .search-suggestions .suggestion-meta { color:var(--muted); font-size:.9em; }
  input[type=text], input[type=password], input[type=search], textarea {
    flex: 1; min-width: 200px; padding: 11px 16px; border-radius: 10px;
    background: var(--panel); border: 1px solid var(--line);
  }
  textarea { width: 100%; min-height: 120px; font-family: "DejaVu Sans Mono", monospace; font-size: 13px; }
  /* Keep native dropdown controls aligned with the active BradsHub theme.
     WebKit on Linux can otherwise draw the closed select and its popup with
     the system's white/light control palette, regardless of the page theme. */
  select {
    color-scheme: dark;
    color: var(--text) !important;
    background-color: var(--panel) !important;
    border: 1px solid var(--line) !important;
    padding: 10px 12px;
    border-radius: 10px;
    accent-color: var(--accent);
  }
  select option, select optgroup {
    color-scheme: dark;
    color: var(--text) !important;
    background-color: var(--panel) !important;
  }
  select:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .btn {
    padding: 10px 20px; border-radius: 10px; border: 0; font-weight: 800;
    background: var(--accent); color: var(--accent-ink);
  }
  .btn.quiet { background: var(--panel-hi); color: var(--text); }
  .btn.ghost { background: rgba(255,255,255,.14); color: #fff; backdrop-filter: blur(6px); }
  .btn.danger { background: #5a2a2f; color: #ffd6d6; }
  .btn.small { padding: 6px 12px; font-size: 14px; }
  .btn:hover { filter: brightness(1.12); }
  .btn[disabled] { opacity: .45; cursor: not-allowed; }
  .btns { display: flex; gap: 10px; flex-wrap: wrap; margin: 16px 0; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .chip {
    padding: 7px 15px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line);
    color: var(--muted); font-weight: 600; font-size: 14px;
  }
  .chip:hover { color: var(--text); border-color: var(--muted); }
  .chip.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .chip.mix { background: transparent; border-style: dashed; }
  .rating { display: inline-block; padding: 1px 8px; border-radius: 6px; background: var(--accent); color: var(--accent-ink); font-weight: 800; font-size: 13px; margin-right: 6px; }

  /* ---------- detail ---------- */
  .dhero { position: relative; margin: -28px -32px 8px; min-height: 480px; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; background: var(--panel); }
  .dbg { position: absolute; inset: 0; background-size: cover; background-position: center 20%; }
  .dshade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(0,0,0,.85) 0%, rgba(0,0,0,.45) 55%, rgba(0,0,0,.2) 100%), linear-gradient(0deg, var(--bg) 0%, transparent 55%); }
  .dtop { position: absolute; top: 20px; left: 32px; z-index: 3; }
  .dcontent { position: relative; z-index: 2; display: flex; gap: 30px; align-items: flex-end; padding: 90px 48px 26px; }
  .dposter { width: 190px; border-radius: var(--radius); box-shadow: 0 14px 40px rgba(0,0,0,.6); flex: 0 0 190px; }
  .dinfo { max-width: 760px; }
  .dinfo h1 { margin: 0 0 6px; font-size: clamp(30px, 4vw, 46px); letter-spacing: -0.03em; line-height: 1.08; text-shadow: 0 2px 20px rgba(0,0,0,.6); }
  .facts { color: #d6dae3; margin-bottom: 12px; font-weight: 600; }
  .desc { max-width: 68ch; color: #dde1ea; margin: 0 0 4px; }

  .list { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; max-width: 900px; }
  .item {
    display: flex; align-items: center; gap: 14px; text-align: left; width: 100%;
    padding: 10px 14px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line);
  }
  button.item:hover { background: var(--panel-hi); }
  .item .grow { flex: 1; min-width: 0; }
  .item .small { color: var(--muted); font-size: 13px; white-space: pre-line; }
  .item.off { opacity: .5; }
  .tag { font-size: 13px; color: var(--muted); }
  .tag.good { color: var(--good); }
  .epbar { height: 4px; border-radius: 2px; background: var(--line); margin-top: 6px; overflow: hidden; }
  .epbar i { display: block; height: 100%; background: var(--accent); }
  .group { margin: 14px 0 4px; font-weight: 700; color: var(--muted); font-size: 14px; }
  .season-head { display: flex; align-items: center; justify-content: space-between; gap: 18px; flex-wrap: wrap; margin: 24px 0 10px; max-width: 900px; }
  .season-head h3 { margin: 0; }
  .season-picker { display: flex; align-items: center; gap: 10px; color: var(--muted); font-weight: 700; }
  .season-picker select { min-width: 190px; min-height: 44px; }

  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 22px; }
  .tabs button { background: var(--panel); border: 0; padding: 8px 16px; border-radius: 999px; font-weight: 600; color: var(--muted); }
  .tabs button.on { background: var(--accent); color: var(--accent-ink); }

  .people { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 10px; }
  .person { flex: 0 0 96px; background: none; border: 0; text-align: center; padding: 0; }
  .person .ph {
    width: 80px; height: 80px; border-radius: 50%; margin: 0 auto 6px; background: var(--panel-hi);
    object-fit: cover; display: grid; place-items: center; font-size: 28px; color: var(--muted);
  }
  .person:hover .ph { box-shadow: 0 0 0 3px var(--accent); }
  .person .n { font-size: 13px; line-height: 1.25; }
  .person .r { font-size: 12px; color: var(--muted); line-height: 1.25; }

  .profiles { display: flex; gap: 34px; flex-wrap: wrap; justify-content: center; margin: 40px 0 26px; }
  .pbtn { background: none; border: 0; text-align: center; padding: 6px; border-radius: 14px; }
  .pbtn:hover .avatar { box-shadow: 0 0 0 4px var(--accent); }
  .pbtn .pname { margin-top: 10px; font-weight: 600; }
  .avatar { display: grid; place-items: center; border-radius: 50%; color: #15112e; font-weight: 800; margin: 0 auto; flex: 0 0 auto; }
  .lock { font-size: 13px; color: var(--muted); }
  .center { text-align: center; }
  .splash { font-size: 44px; font-weight: 900; letter-spacing: -0.04em; margin: 40px 0 0; background: linear-gradient(90deg, var(--text), var(--accent)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .intro { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; overflow: hidden; background: #050506; transition: opacity .55s ease, visibility .55s ease; }
  .intro.done { opacity: 0; visibility: hidden; pointer-events: none; }
  .intro::before { content: ""; position: absolute; width: min(70vw, 760px); height: min(70vw, 760px); border-radius: 50%; background: radial-gradient(circle, rgba(255,157,0,.14) 0%, rgba(255,157,0,.07) 38%, transparent 72%); opacity: .8; animation: introGlow 1.5s ease both; }
  .intro-name { position: relative; color: #e50914; font: 950 clamp(48px, 12vw, 148px)/1 Impact, "Arial Narrow", sans-serif; letter-spacing: -.065em; transform: scaleX(.94); animation: introReveal 1.5s cubic-bezier(.2,.7,.2,1) both; }
  .intro-name::first-letter { letter-spacing: -.09em; }
  .intro-hint { position: absolute; bottom: 7vh; color: #a5a5a5; font-size: 13px; letter-spacing: .16em; text-transform: uppercase; animation: hintFade 1.5s both; }
  @keyframes introReveal { 0% { opacity: 0; transform: scaleX(.94) scale(.88); } 70% { opacity: 1; transform: scaleX(.94) scale(1.025); } 100% { opacity: 1; transform: scaleX(.94) scale(1); } }
  @keyframes introGlow { 0% { transform: scale(.92); opacity: .35; } 100% { transform: scale(1.08); opacity: .8; } }
  @keyframes hintFade { 0%, 65% { opacity: 0; } 100% { opacity: .8; } }
  @media (prefers-reduced-motion: reduce) { .intro, .intro::before, .intro-name, .intro-hint { animation: none !important; transition: none !important; } }
  .catalog-group { margin: 12px 0 26px; padding: 18px 18px 2px; border: 1px solid var(--line); border-radius: var(--radius); background: linear-gradient(135deg, color-mix(in srgb, var(--panel) 92%, var(--accent) 8%), var(--panel)); }
  .catalog-group > h2 { display: flex; justify-content: space-between; align-items: center; }
  .group-count { color: var(--muted); font-size: 12px; font-weight: 600; }

  .form { max-width: 760px; }
  .field { margin: 0 0 18px; }
  .field label.t { display: block; font-weight: 700; margin-bottom: 6px; }
  .field .hint { color: var(--muted); font-size: 14px; margin-top: 4px; }
  .check { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 14px; }
  .check input { width: 20px; height: 20px; margin-top: 3px; accent-color: var(--accent); }
  .inline { display: flex; gap: 10px; flex-wrap: wrap; }
  .note { background: var(--panel); border-left: 4px solid var(--accent); padding: 12px 16px; border-radius: 6px; max-width: 72ch; margin-bottom: 22px; }
  .swatches { display: flex; gap: 10px; }
  .swatch { width: 34px; height: 34px; border-radius: 50%; border: 3px solid transparent; }
  .swatch.on { border-color: var(--text); }

  .themes { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; margin-bottom: 18px; }
  .tcard { border-radius: 12px; border: 2px solid var(--line); padding: 12px; text-align: left; min-height: 96px; position: relative; }
  .tcard.on { border-color: var(--accent); }
  .tcard .stripes { display: flex; gap: 4px; margin: 10px 0 8px; }
  .tcard .stripes i { flex: 1; height: 14px; border-radius: 4px; }
  .tcard .nm { font-weight: 700; font-size: 14px; }
  .tcard .tools { display: flex; gap: 6px; margin-top: 8px; }
  .badge { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--panel-hi); border: 1px solid var(--line);
    padding: 12px 20px; border-radius: 10px; z-index: 30; max-width: 90vw;
  }
  .toast.bad { color: var(--bad); }
  .countdown {
    position: fixed; bottom: 24px; right: 24px; background: var(--panel-hi); border: 1px solid var(--accent);
    padding: 12px 16px; border-radius: 10px; z-index: 30; display: flex; gap: 14px; align-items: center;
  }
  .player-overlay { position: fixed; inset: 0; z-index: 1000; display: flex; flex-direction: column; gap: 12px; padding: 18px; background: #000; color: #fff; }
  .player-top { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .player-top strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .player-overlay video { width: 100%; height: 0; min-height: 0; flex: 1; background: #000; object-fit: contain; }
  .player-message { color: #ddd; text-align: center; }
  .player-actions { display: flex; justify-content: center; }
  .overlay { position: fixed; inset: 0; background: rgba(5,7,10,.75); display: grid; place-items: center; z-index: 20; padding: 16px; }

<script>
"use strict";
// =====================================================================
//  Constants
// =====================================================================
const CINEMETA = "https://v3-cinemeta.strem.io";   // built-in metadata provider
const GENRES = ["Action", "Adventure", "Animation", "Biography", "Comedy", "Crime", "Documentary",
  "Drama", "Family", "Fantasy", "History", "Horror", "Music", "Mystery", "Romance", "Sci-Fi",
  "Sport", "Thriller", "War", "Western"];
const COLORS = ["#a594ff", "#ff8fab", "#ffb86b", "#6fd3b2", "#6ec1ff", "#e0d36f"];
// [3-letter code, 2-letter code, name]
const LANGS = [["eng", "en", "English"], ["spa", "es", "Spanish"], ["fre", "fr", "French"],
  ["ger", "de", "German"], ["ita", "it", "Italian"], ["por", "pt", "Portuguese"],
  ["rus", "ru", "Russian"], ["jpn", "ja", "Japanese"], ["kor", "ko", "Korean"],
  ["chi", "zh", "Chinese"], ["ara", "ar", "Arabic"], ["hin", "hi", "Hindi"],
  ["tur", "tr", "Turkish"], ["pol", "pl", "Polish"], ["dut", "nl", "Dutch"],
  ["swe", "sv", "Swedish"], ["dan", "da", "Danish"], ["nor", "no", "Norwegian"],
  ["fin", "fi", "Finnish"], ["gre", "el", "Greek"], ["heb", "he", "Hebrew"],
  ["ukr", "uk", "Ukrainian"], ["cze", "cs", "Czech"], ["hun", "hu", "Hungarian"],
  ["rum", "ro", "Romanian"], ["tha", "th", "Thai"], ["vie", "vi", "Vietnamese"],
  ["ind", "id", "Indonesian"]];
const ALT_CODE = { fre: "fra", ger: "deu", chi: "zho", dut: "nld", gre: "ell", cze: "ces", rum: "ron" };

// =====================================================================
//  Small helpers
// =====================================================================
const $ = (sel) => document.querySelector(sel);
const app = document.getElementById("app");
const enc = encodeURIComponent;

function esc(text) {
  return String(text == null ? "" : text).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4); }
function isWeb(url) { return typeof url === "string" && /^https?:\/\//i.test(url); }
function fmtTime(sec) {
  sec = Math.max(0, Math.floor(sec || 0));
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  const mm = String(m).padStart(h ? 2 : 1, "0"), ss = String(s).padStart(2, "0");
  return h ? `${h}:${mm}:${ss}` : `${mm}:${ss}`;
}
function fmtDate(ts) {
  try { return new Date(ts).toLocaleString([], { dateStyle: "medium", timeStyle: "short" }); } catch (e) { return ""; }
}

async function getJSON(url, ms) {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), ms || 15000);
  try {
    const res = await fetch(url, { signal: ctl.signal, cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    return await res.json();
  } finally { clearTimeout(timer); }
}

const cache = new Map();   // url -> {t, data}
async function getCached(url, ms) {
  const hit = cache.get(url);
  if (hit && Date.now() - hit.t < 5 * 60 * 1000) return hit.data;
  const data = await getJSON(url, ms);
  cache.set(url, { t: Date.now(), data });
  return data;
}

let toastTimer = null;
function toast(message, bad) {
  document.querySelectorAll(".toast").forEach((t) => t.remove());
  const el = document.createElement("div");
  el.className = "toast" + (bad ? " bad" : "");
  el.textContent = message;
  document.body.appendChild(el);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.remove(), 4500);
}

// ---- dialogs (the built-in prompt() is not available in this window) ----
function modal(build) {
  return new Promise((resolve) => {
    const overlay = document.createElement("div");
    overlay.className = "overlay";
    const box = document.createElement("div");
    box.className = "dialog";
    box.setAttribute("role", "dialog");
    box.setAttribute("aria-modal", "true");
    overlay.appendChild(box);
    document.body.appendChild(overlay);
    const onKey = (e) => { if (e.key === "Escape") close(null); };
    const close = (value) => {
      document.removeEventListener("keydown", onKey);
      overlay.remove();
      resolve(value);
    };
    document.addEventListener("keydown", onKey);
    overlay.addEventListener("mousedown", (e) => { if (e.target === overlay) close(null); });
    build(box, close);
  });
}

function askText(title, opts) {
  opts = opts || {};
  return modal((box, close) => {
    box.innerHTML = `<h3>${esc(title)}</h3>
      <input id="dlgin" type="${opts.type || "text"}" value="${esc(opts.value || "")}"
        placeholder="${esc(opts.placeholder || "")}" autocomplete="off"
        ${opts.numeric ? 'inputmode="numeric" maxlength="4"' : ""}>
      <div class="dlgrow"><button class="btn quiet" id="dlgno">Cancel</button>
      <button class="btn" id="dlgok">${esc(opts.okLabel || "OK")}</button></div>`;
    const input = box.querySelector("#dlgin");
    const ok = () => close(input.value);
    box.querySelector("#dlgno").onclick = () => close(null);
    box.querySelector("#dlgok").onclick = ok;
    input.onkeydown = (e) => { if (e.key === "Enter") ok(); };
    setTimeout(() => input.focus(), 0);
  });
}

function confirmBox(message, okLabel) {
  return modal((box, close) => {
    box.innerHTML = `<h3>${esc(message)}</h3>
      <div class="dlgrow"><button class="btn quiet" id="dlgno">Cancel</button>
      <button class="btn danger" id="dlgok">${esc(okLabel || "OK")}</button></div>`;
    box.querySelector("#dlgno").onclick = () => close(false);
    box.querySelector("#dlgok").onclick = () => close(true);
    setTimeout(() => box.querySelector("#dlgno").focus(), 0);
  }).then((v) => v === true);
}

// =====================================================================
//  Data: profiles, settings, saving, syncing
// =====================================================================
let state = null;     // everything that is saved
let profile = null;   // the profile currently watching

function defaultSettings() {
  return { alang: "eng", slang: "eng", subsOff: false, autoplayFirst: false, autoplayNext: true, metaAddon: "", bestStream: true, minQuality: "any", maxQuality: "2160", skipIntro: false, skipIntroSeconds: 90, streamRules: "" };
}
function fixProfile(p) {
  p.addons = p.addons || [];
  p.catalogs = p.catalogs || {};
  p.catalogs.order = p.catalogs.order || [];
  p.catalogs.home = p.catalogs.home || {};
  p.catalogs.discover = p.catalogs.discover || {};
  p.catalogGroups = Array.isArray(p.catalogGroups) ? p.catalogGroups.filter((g) => g && typeof g.name === "string" && Array.isArray(g.catalogs)) : [];
  p.watchlists = p.watchlists || [];
  p.history = p.history || [];
  p.progress = p.progress || {};
  p.settings = Object.assign(defaultSettings(), p.settings || {});
  p.pin = p.pin || null;
  p.color = p.color || COLORS[0];
  return p;
}
function newProfile(name, color) {
  return fixProfile({
    id: uid(), name, color,
    watchlists: [{ id: uid(), name: "Watch later", items: [] }],
  });
}
function fixState(s) {
  s.syncPath = s.syncPath || "";
  s.updatedAt = s.updatedAt || 0;
  s.themes = Array.isArray(s.themes) ? s.themes : [];
  s.themeId = s.themeId || "bradflix";
  s.layout = s.layout || "sidebar";
  s.cards = s.cards || "round";
  s.font = s.font || "modern";
  s.customCss = s.customCss || "";
  return s;
}
function migrate(s) {
  if (s && Array.isArray(s.profiles) && s.profiles.length) {
    s.profiles.forEach(fixProfile);
    return fixState(s);
  }
  // First run, or data from the very first version of this app.
  const p = newProfile("Me", COLORS[0]);
  if (s && Array.isArray(s.addons)) p.addons = s.addons;
  if (s && Array.isArray(s.history)) {
    p.history = s.history.map((h) => ({ id: h.id, type: h.type, name: h.name, poster: h.poster, videoId: h.id, at: Date.now() }));
  }
  return fixState({ version: 2, profiles: [p] });
}

async function loadState() {
  let saved = null;
  try { saved = await getJSON("/api/state"); } catch (e) { /* first run */ }
  state = migrate(saved || {});
}

let saveTimer = null;
function save() {
  state.updatedAt = Date.now();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flushSave, 400);
}
async function flushSave() {
  try { await fetch("/api/state", { method: "POST", body: JSON.stringify(state) }); } catch (e) { /* ignore */ }
  if (state.syncPath) pushSync();
}

async function pushSync() {
  try {
    await fetch("/api/file/write", { method: "POST",
      body: JSON.stringify({ path: state.syncPath, content: JSON.stringify(state) }) });
  } catch (e) { /* ignore */ }
}
// Takes newer data from the sync file if there is some, otherwise sends ours.
async function syncNow(manual) {
  if (!state.syncPath) return;
  try {
    const res = await fetch("/api/file/read", { method: "POST", body: JSON.stringify({ path: state.syncPath }) });
    if (!res.ok) {
      await pushSync();
      if (manual) toast("No sync file yet, so I created one.");
      return;
    }
    const remote = JSON.parse((await res.json()).content);
    if ((remote.updatedAt || 0) > (state.updatedAt || 0)) {
      const keepPath = state.syncPath;
      const currentId = profile && profile.id;
      state = migrate(remote);
      state.syncPath = keepPath;
      applyTheme();
      profile = state.profiles.find((p) => p.id === currentId) || null;
      await fetch("/api/state", { method: "POST", body: JSON.stringify(state) });
      if (manual) toast("Pulled newer data from the sync file.");
      return true;
    }
    await pushSync();
    if (manual) toast("Already up to date. Sent this computer's data to the sync file.");
  } catch (e) {
    if (manual) toast("Sync failed. Check the file path.", true);
  }
}

// ---- PIN (a family lock, not strong security; the data is stored in plain text) ----
async function hashPin(pin, salt) {
  const text = salt + ":" + pin;
  if (typeof crypto !== "undefined" && crypto.subtle) {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
    return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, "0")).join("");
  }
  let h = 5381;
  for (let i = 0; i < text.length; i++) h = ((h * 33) ^ text.charCodeAt(i)) >>> 0;
  return "x" + h.toString(16);
}
async function verifyPin(p) {
  if (!p.pin) return true;
  const entered = await askText(`PIN for ${p.name}`, { type: "password", numeric: true, okLabel: "Unlock" });
  if (entered == null) return false;
  if ((await hashPin(entered, p.pin.salt)) === p.pin.hash) return true;
  toast("Wrong PIN.", true);
  return false;
}

// =====================================================================
//  Language, add-on and catalog helpers
// =====================================================================
function langEntry(code) { return LANGS.find((l) => l[0] === code); }
function langList(code) { const e = langEntry(code); return e ? `${e[0]},${e[1]}` : ""; }
function langMatches(lang, pref) {
  if (!lang || !pref) return false;
  const l = String(lang).toLowerCase();
  const e = langEntry(pref);
  if (!e) return l === pref;
  return l === e[0] || l === (ALT_CODE[e[0]] || "") || l === e[1] || l.startsWith(e[1] + "-") || l.startsWith(e[2].toLowerCase());
}

const addonBase = (url) => String(url).replace(/\/manifest\.json.*$/i, "").replace(/\/+$/, "");

function normalizeManifestUrl(text) {
  let url = text.trim().replace(/^stremio:\/\//i, "https://");
  if (!/^https?:\/\//i.test(url)) url = "https://" + url;
  if (!/manifest\.json/i.test(url)) url = url.replace(/\/+$/, "") + "/manifest.json";
  return url;
}

function addonSupports(addon, resource, type, id) {
  const m = addon.manifest || {};
  const entry = (m.resources || []).find((r) => (typeof r === "string" ? r : r.name) === resource);
  if (!entry) return false;
  const types = (typeof entry === "object" && entry.types) || m.types || [];
  const prefixes = (typeof entry === "object" && entry.idPrefixes) || m.idPrefixes || [];
  if (types.length && !types.includes(type)) return false;
  if (id !== "" && prefixes.length && !prefixes.some((p) => String(id).startsWith(p))) return false;
  return true;
}
function resourceNames(manifest) {
  return (manifest.resources || []).map((r) => (typeof r === "string" ? r : r.name));
}

// What a catalog can do: browse, search, filter by genre.
function catalogInfo(c) {
  let required = [], supportsSearch = false, supportsGenre = false, genres = null;
  for (const e of c.extra || []) {
    if (e.name === "genre") { supportsGenre = true; genres = e.options || null; if (e.isRequired) required.push("genre"); }
    else if (e.name === "search") { supportsSearch = true; if (e.isRequired) required.push("search"); }
    else if (e.isRequired && e.name !== "skip") required.push(e.name);
  }
  if (Array.isArray(c.extraSupported)) {   // older add-on format
    if (c.extraSupported.includes("search")) supportsSearch = true;
    if (c.extraSupported.includes("genre")) supportsGenre = true;
  }
  if (Array.isArray(c.extraRequired)) required = required.concat(c.extraRequired);
  const others = required.filter((r) => r !== "genre" && r !== "skip");
  return {
    browsable: others.length === 0,
    supportsSearch,
    genres: supportsGenre ? (genres && genres.length ? genres : null) : null,
    genreRequired: required.includes("genre"),
  };
}

function builtinCatalogs() {
  return ["movie", "series"].map((t) => ({
    key: `builtin|${t}|top`, base: CINEMETA, type: t, id: "top", source: "Built-in",
    title: t === "movie" ? "Popular movies" : "Popular series",
    browsable: true, supportsSearch: true, genres: GENRES, genreRequired: false,
  }));
}
function addonCatalogs(addons) {
  const out = [];
  for (const addon of addons) {
    for (const c of (addon.manifest && addon.manifest.catalogs) || []) {
      const info = catalogInfo(c);
      out.push(Object.assign({
        key: `${addonBase(addon.url)}|${c.type}|${c.id}`, base: addonBase(addon.url),
        type: c.type, id: c.id, source: addon.name,
        title: `${c.name || c.id} (${addon.name})`,
      }, info));
    }
  }
  return out;
}
// Browsable catalogs in the order the person chose.
function allCatalogs() {
  const list = builtinCatalogs().concat(addonCatalogs(profile.addons).filter((c) => c.browsable));
  const order = profile.catalogs.order;
  const rank = (c, i) => { const p = order.indexOf(c.key); return p < 0 ? 1e6 + i : p; };
  return list.map((c, i) => [c, rank(c, i)]).sort((a, b) => a[1] - b[1]).map((x) => x[0]);
}
function visibleCatalogs(where) {
  return allCatalogs().filter((c) => profile.catalogs[where][c.key] !== false);
}
function catalogURL(cat, opts) {
  opts = opts || {};
  const extra = [];
  if (opts.search) extra.push("search=" + enc(opts.search));
  if (opts.genre) extra.push("genre=" + enc(opts.genre));
  if (opts.skip) extra.push("skip=" + opts.skip);
  return `${cat.base}/catalog/${cat.type}/${enc(cat.id)}${extra.length ? "/" + extra.join("&") : ""}.json`;
}
function toItem(meta, fallbackType) {
  return { id: meta.id, type: meta.type || fallbackType, name: meta.name, poster: meta.poster,
    bg: meta.background, logo: meta.logo, desc: meta.description, year: meta.releaseInfo || meta.year,
    rating: meta.imdbRating, genres: meta.genres };
}

// =====================================================================
//  Progress, history, lists
// =====================================================================
function finishedNums(pos, dur) { return dur > 0 && (pos / dur >= 0.92 || dur - pos < 90); }
function prog(videoId) { return profile.progress[videoId] || null; }
function isWatched(videoId) {
  const p = prog(videoId);
  return !!p && (p.watched === true || finishedNums(p.pos, p.dur));
}
function resumeAt(videoId) {
  const p = prog(videoId);
  if (p && !isWatched(videoId) && p.pos >= 15 && p.dur > 0) return p.pos;
  return 0;
}
function recordProgress(ctx, pos, dur, p) {
  if (ctx.noTrack || !ctx.videoId || !(dur > 0)) return;
  (p || profile).progress[ctx.videoId] = {
    videoId: ctx.videoId, itemId: ctx.record.id, type: ctx.type, name: ctx.record.name,
    poster: ctx.record.poster, bg: ctx.record.bg, title: ctx.title, season: ctx.season, episode: ctx.episode,
    pos, dur, at: Date.now(), watched: finishedNums(pos, dur),
  };
}
function addHistory(ctx) {
  if (ctx.noTrack) return;
  profile.history = profile.history.filter((h) => h.videoId !== ctx.videoId);
  profile.history.unshift({ id: ctx.record.id, type: ctx.type, name: ctx.record.name,
    poster: ctx.record.poster, bg: ctx.record.bg, title: ctx.title, videoId: ctx.videoId, at: Date.now() });
  profile.history = profile.history.slice(0, 300);
  save();
}
function continueItems() {
  const latest = new Map();   // title id -> newest unfinished entry
  Object.values(profile.progress)
    .filter((p) => !p.watched && p.dur > 0 && p.pos >= 30 && !finishedNums(p.pos, p.dur))
    .sort((a, b) => b.at - a.at)
    .forEach((p) => { if (!latest.has(p.itemId)) latest.set(p.itemId, p); });
  return [...latest.values()].slice(0, 24).map((p) => ({
    id: p.itemId, type: p.type, name: p.name, poster: p.poster, bg: p.bg,
    pct: p.pos / p.dur, sub: p.title && p.title !== p.name ? p.title.replace(p.name, "").trim() + " · " + fmtTime(p.pos) : fmtTime(p.pos),
  }));
}

function listsContaining(itemId) { return profile.watchlists.filter((l) => l.items.some((i) => i.id === itemId)); }
function addToList(list, item) {

    list.items.push({ id: item.id, type: item.type, name: item.name, poster: item.poster });
  }
}

let stack = [];     // pages we can go back to
let view = null;    // { refresh() } for the page on screen, if it needs live updates
let heroTimer = null;

function clearHero() { clearInterval(heroTimer); heroTimer = null; }
function setNav(name) {
  clearHero();
  document.querySelectorAll("#nav button").forEach((b) => b.classList.toggle("on", b.dataset.go === name));
  window.scrollTo(0, 0);
}
function go(fn) { stack.push(fn); fn(); }
function back() {
  stack.pop();
  const fn = stack[stack.length - 1];
  if (fn) fn(); else showHome();
}
function installKeyboardShortcuts() {
  document.addEventListener("keydown", (event) => {
    if (event.defaultPrevented || document.querySelector(".overlay, .player-overlay")) return;
    const key = event.key.toLowerCase();
    if ((event.ctrlKey || event.metaKey) && key === "k") {
      event.preventDefault();
      if (!profile) return;
      if (document.activeElement === $("#q")) { $("#q").focus(); $("#q").select(); }
      else tab("search");
      return;
    }
    const target = event.target;
    const editing = target && (target.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(target.tagName));
    if (event.altKey && event.key === "ArrowLeft" && profile && stack.length > 1 && !editing) {
      event.preventDefault();
      back();
    }
  });
}
function tab(name) {
  const pages = {
    home: showHome, discover: showDiscover, movies: () => showRoom("movie"), shows: () => showRoom("series"),
    calendar: showReleaseCalendar, search: () => showSearch(), library: showLists, history: showHistory, addons: showAddons, settings: () => showSettings(),
  };
  stack = [pages[name]];
  pages[name]();
}
function backButton() {
  return stack.length > 1 ? `<button class="btn ghost" id="back">← Back</button>` : "";
}
function wireBack() { const b = $("#back"); if (b) b.onclick = back; }
function libTabs(active) {
  return `<div class="tabs"><button class="${active === "lists" ? "on" : ""}" onclick="tab('library')">My Lists</button>
    <button class="${active === "history" ? "on" : ""}" onclick="tab('history')">Watch history</button></div>`;
}
function cssUrl(u) { return String(u || "").replace(/[\\'"()\s]/g, (c) => "%" + c.charCodeAt(0).toString(16).padStart(2, "0")); }

function cardHTML(item, i, removable, variant) {
  const img = variant === "wide" ? (item.bg || item.poster) : item.poster;
  const poster = img
    ? `<img class="poster" loading="lazy" src="${esc(img)}" alt="">`
    : `<div class="poster ph">${esc((item.name || "?").slice(0, 1))}</div>`;
  const bar = item.pct ? `<div class="bar"><i style="width:${Math.round(item.pct * 100)}%"></i></div>` : "";
  const sub = item.sub ? `<div class="sub">${esc(item.sub)}</div>` : "";
  const num = variant === "top10" ? `<span class="num${i >= 9 ? " double" : ""}" aria-hidden="true">${i + 1}</span>` : "";
  const v = variant || "";
  return `<div class="cardwrap ${v}">${num}<button class="card ${v}" data-i="${i}"><div class="pw">${poster}${bar}</div>
    <div class="name">${esc(item.name)}</div>${sub}</button>
    ${removable ? `<button class="x" data-rm="${i}" aria-label="Remove ${esc(item.name)}">✕</button>` : ""}</div>`;
}
function fillCards(container, items, onRemove, variant) {
  container.innerHTML = items.map((it, i) => cardHTML(it, i, !!onRemove, variant)).join("");
  container.querySelectorAll(".card").forEach((btn) => {
    btn.onclick = () => { const it = items[Number(btn.dataset.i)]; go(() => showDetail(it.type, it.id, it)); };
  });
  if (onRemove) container.querySelectorAll("[data-rm]").forEach((b) => {
    b.onclick = () => onRemove(items[Number(b.dataset.rm)]);
  });
}

// A horizontal rail with scroll arrows. Loads when it scrolls near the screen.
function addRow(title, opts) {
  opts = opts || {};
  const section = document.createElement("section");
  section.className = "row";
  section.innerHTML = `<h2>${esc(title)}</h2><div class="railwrap"><button class="arrow l" aria-label="Scroll left">‹</button>
    <div class="scroller"><span class="muted">Loading…</span></div><button class="arrow r" aria-label="Scroll right">›</button></div>`;
  (opts.into || app).appendChild(section);
  const box = section.querySelector(".scroller");
  section.querySelector(".arrow.l").onclick = () => box.scrollBy({ left: -box.clientWidth * 0.8 });
  section.querySelector(".arrow.r").onclick = () => box.scrollBy({ left: box.clientWidth * 0.8 });

  const load = async () => {
    try {
      let items = opts.items;
      if (!items) {
        const genre = opts.genre || (opts.cat.genreRequired && opts.cat.genres ? opts.cat.genres[0] : "");
        const d = await getCached(catalogURL(opts.cat, { genre }));
        items = (d.metas || []).map((m) => toItem(m, opts.cat.type));
      }
      if (opts.limit) items = items.slice(0, opts.limit);
      if (!items.length) { section.remove(); return; }
      fillCards(box, items, null, opts.variant);
    } catch (e) {
      box.innerHTML = `<span class="muted">Could not load this list. Check your internet connection.</span>`;
    }
  };
  if (opts.lazy && "IntersectionObserver" in window) {
    const io = new IntersectionObserver((entries) => {
      if (entries.some((e) => e.isIntersecting)) { io.disconnect(); load(); }
    }, { rootMargin: "500px" });
    io.observe(section);
  } else load();
}

async function heroItemsFrom(candidates, count) {
  const out = [];
  const enriched = await Promise.all(candidates.slice(0, count + 4).map(async (it) => {
    if (it.bg && it.desc) return it;
    const meta = await fetchMeta(it.type, it.id);
    if (!meta) return it;
    return Object.assign({}, it, {
      bg: it.bg || meta.background, logo: meta.logo, desc: it.desc || meta.description,
      year: meta.releaseInfo || meta.year, rating: meta.imdbRating, genres: meta.genres || it.genres,
    });
  }));
  for (const it of enriched) { if (it.bg) out.push(it); if (out.length >= count) break; }
  return out;
}

function mountHero(slot, items) {
  if (!items.length) return;
  const sec = document.createElement("section");
  sec.className = "hero";
  sec.innerHTML = items.map((it, i) => `<div class="slide ${i === 0 ? "on" : ""}" style="background-image:url('${cssUrl(it.bg)}')"></div>`).join("") +
    `<div class="hshade"></div><div class="hbody"></div>
     <div class="dots">${items.map((_, i) => `<button class="${i === 0 ? "on" : ""}" aria-label="Show slide ${i + 1}"></button>`).join("")}</div>`;
  slot.appendChild(sec);
  let at = 0;
  const show = (i) => {
    at = (i + items.length) % items.length;
    const it = items[at];
    sec.querySelectorAll(".slide").forEach((s, n) => s.classList.toggle("on", n === at));
    sec.querySelectorAll(".dots button").forEach((d, n) => d.classList.toggle("on", n === at));
    const meta = [it.type === "series" ? "Series" : "Movie", it.year, it.rating ? `★ ${it.rating}` : ""].filter(Boolean).join("  ·  ");
    const desc = (it.desc || "").length > 220 ? it.desc.slice(0, 217) + "…" : (it.desc || "");
    sec.querySelector(".hbody").innerHTML = `<div class="kicker">${it.type === "series" ? "Featured series" : "Featured movie"}</div>
      <h1>${esc(it.name)}</h1><div class="meta">${esc(meta)}</div><p>${esc(desc)}</p>
      <div class="btns" style="margin:0"><button class="btn" id="hplay">▶ Play</button><button class="btn ghost" id="hinfo">More info</button></div>`;
    sec.querySelector("#hplay").onclick = () => go(() => showDetail(it.type, it.id, it, { play: true }));
    sec.querySelector("#hinfo").onclick = () => go(() => showDetail(it.type, it.id, it));
  };
  sec.querySelectorAll(".dots button").forEach((d, n) => { d.onclick = () => { show(n); restart(); } });
  const restart = () => { clearHero(); heroTimer = setInterval(() => show(at + 1), 8000); };
  show(0);
  restart();
}

async function showHome() {
  setNav("home"); view = { refresh: showHome };
  app.innerHTML = "";
  const heroSlot = document.createElement("div");
  app.appendChild(heroSlot);

  const cw = continueItems();
  if (cw.length) addRow("Continue watching", { items: cw, variant: "wide" });

  const cats = visibleCatalogs("home");
  const groupedKeys = new Set();
  for (const group of profile.catalogGroups || []) {
    const groupCats = group.catalogs.map((key) => cats.find((cat) => cat.key === key)).filter(Boolean);
    if (!groupCats.length) continue;
    const section = document.createElement("section"); section.className = "catalog-group";
    section.innerHTML = `<h2>${esc(group.name)} <span class="group-count">${groupCats.length} catalog${groupCats.length === 1 ? "" : "s"}</span></h2>`;
    app.appendChild(section);
    for (const c of groupCats) {
      groupedKeys.add(c.key);
      const builtin = c.key.startsWith("builtin|");
      addRow(builtin ? `Top 10 ${c.type === "movie" ? "movies" : "series"} today` : c.title,
        { cat: c, variant: builtin ? "top10" : undefined, limit: builtin ? 10 : 0, lazy: true, into: section });
    }
  }
  let first = true;
  for (const c of cats.filter((cat) => !groupedKeys.has(cat.key))) {
    const builtin = c.key.startsWith("builtin|");
    addRow(builtin ? `Top 10 ${c.type === "movie" ? "movies" : "series"} today` : c.title,
      { cat: c, variant: builtin ? "top10" : undefined, limit: builtin ? 10 : 0, lazy: !first });
    first = false;
  }
  const mixes = document.createElement("section");
  mixes.className = "row";
  mixes.innerHTML = mixChips("movie");
  app.appendChild(mixes);
  wireMixChips(mixes, "movie");
  if (!cats.length && !cw.length) {
    app.insertAdjacentHTML("afterbegin", `<p class="muted">Your home screen is empty. Turn catalogs on in Settings, then Catalogs.</p>`);
  }

  // The banner loads last so the page appears instantly.
  try {
    const [movies, shows] = await Promise.all([topItems("movie"), topItems("series")]);
    const mixed = [];
    for (let i = 0; i < 6; i++) { if (movies[i]) mixed.push(movies[i]); if (shows[i]) mixed.push(shows[i]); }
    mountHero(heroSlot, await heroItemsFrom(mixed, 4));
  } catch (e) { /* offline: no banner */ }
}

async function showRoom(type) {
  setNav(type === "movie" ? "movies" : "shows"); view = null;

  app.appendChild(heroSlot);

async function showReleaseCalendar() {
  setNav("calendar"); view = null;
  app.innerHTML = `<h2>TV & show release calendar</h2><p class="muted">TVmaze episodes from the US, Canada, and Japan only. News and shows without a matching country are filtered out. Times use your local time zone.</p><div class="filters"><button class="btn quiet" id="calprev">← Previous week</button><strong id="caldate"></strong><button class="btn quiet" id="calnext">Next week →</button><button class="btn" id="calrefresh">Refresh</button></div><div id="calbody"><p class="muted">Loading schedule…</p></div>`;
  const weekStart = new Date(); weekStart.setHours(0,0,0,0); weekStart.setDate(weekStart.getDate() - ((weekStart.getDay()+6)%7));
  let offset = 0;
  const load = async () => {
    const startDay = new Date(weekStart); startDay.setDate(startDay.getDate()+offset);
    const endDay = new Date(startDay); endDay.setDate(endDay.getDate()+6);
    const fmt = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const nice = d => d.toLocaleDateString(undefined,{month:"short",day:"numeric"});
    $("#caldate").textContent = `${nice(startDay)} – ${nice(endDay)}, ${endDay.getFullYear()}`;
    $("#calbody").innerHTML = `<p class="muted">Loading episodes for the week…</p>`;
    try {
      const dates = Array.from({length:7}, (_,i) => { const d=new Date(startDay); d.setDate(d.getDate()+i); return d; });
      const pages = await Promise.all(dates.map(d => getJSON(`https://api.tvmaze.com/schedule?date=${fmt(d)}`, 12000).catch(() => [])));
      const allowedCountries = new Set(["US", "CA", "JP"]);
      const isAllowedRelease = (episode) => {
        const show = episode && episode.show;
        if (!show || !episode.name) return false;
        const genres = Array.isArray(show.genres) ? show.genres.map(g => String(g).trim().toLowerCase()) : [];
        if (String(show.type || "").toLowerCase().includes("news") || genres.includes("news")) return false;
        const country = show.network && show.network.country && show.network.country.code ||
          show.webChannel && show.webChannel.country && show.webChannel.country.code ||
          show.country && show.country.code || "";
        return allowedCountries.has(String(country).trim().toUpperCase());
      };
      const groups = dates.map((d,i) => ({date:d, entries:(Array.isArray(pages[i])?pages[i]:[]).filter(isAllowedRelease).sort((a,b)=>String(a.airtime||'').localeCompare(String(b.airtime||'')))}));
      const total = groups.reduce((n,g)=>n+g.entries.length,0);
      if (!total) { $("#calbody").innerHTML = `<p class="muted">No eligible US, Canadian, or Japanese TV episodes were found for this week, or the schedule service is unavailable.</p>`; return; }
      $("#calbody").innerHTML = groups.filter(g=>g.entries.length).map(g => `<section class="release-day"><h3 class="release-date">${esc(g.date.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"}))}</h3>${g.entries.map(e => `<div class="release-item">${e.show.image && e.show.image.medium ? `<img src="${esc(e.show.image.medium)}" alt="">` : `<div style="width:64px;height:88px;background:var(--panel);border-radius:var(--radius)"></div>`}<div class="grow"><strong>${esc(e.show.name)}</strong><div>${esc(e.name || "Episode")}</div><div class="small muted">${e.season ? `Season ${e.season}` : ""}${e.number ? ` · Episode ${e.number}` : ""}${e.airtime ? ` · ${esc(e.airtime)}` : ""}${e.show.network && e.show.network.name ? ` · ${esc(e.show.network.name)}` : e.show.webChannel && e.show.webChannel.name ? ` · ${esc(e.show.webChannel.name)}` : ""}</div></div><a href="${esc(e.show.url || "https://www.tvmaze.com")}" target="_blank" rel="noreferrer" class="btn quiet small">Details</a></div>`).join("")}</section>`).join("");
    } catch (e) { $("#calbody").innerHTML = `<p class="muted">Could not load the calendar. Check your internet connection and try again.</p>`; }
  };
  $("#calprev").onclick = () => { offset -= 7; load(); };
  $("#calnext").onclick = () => { offset += 7; load(); };
  $("#calrefresh").onclick = load; await load();
}

//  Discover (pick several genres to mix them)
// =====================================================================
const discover = { key: "builtin|movie|top", genres: [], mode: "all", items: [], seen: new Set(), st: null, busy: false };

// Roughly rarest first, so the search starts from the smallest pile.
const RARITY = ["Documentary", "Western", "War", "Biography", "History", "Music", "Musical", "Sport", "Horror", "Animation",
  "Family", "Fantasy", "Mystery", "Sci-Fi", "Romance", "Thriller", "Adventure", "Crime", "Action", "Comedy", "Drama"];
function byRarity(genres) {
  const rank = (g) => { const i = RARITY.indexOf(g); return i < 0 ? 50 : i; };
  return genres.slice().sort((a, b) => rank(a) - rank(b));
}
function genresOf(m) {
  const g = Array.isArray(m.genres) ? m.genres : Array.isArray(m.genre) ? m.genre : null;
  return g ? g.map((x) => String(x).toLowerCase()) : null;
}
async function pageOf(cat, genre, skip) {
  try { const d = await getCached(catalogURL(cat, { genre, skip })); return d.metas || []; } catch (e) { return null; }
}
// For titles that do not list their genres: collect ids of the other genres' lists.
async function loadSets(cat, genres, st) {
  for (const g of genres) {
    if (st.sets[g]) continue;
    const set = new Set();
    let skip = 0;
    for (let i = 0; i < 10; i++) {
      const p = await pageOf(cat, g, skip);
      if (!p || !p.length) break;
      skip += p.length;
      p.forEach((m) => set.add(m.id));
    }
    st.sets[g] = set;
  }
}

// Returns the next batch of titles for the chosen genres.
//   "all"  -> every selected genre must match (horror comedies, and so on)
//   "any"  -> titles from any of the selected genres, mixed together
async function fetchDiscover(cat, genres, mode, st, seen) {
  const want = 24, out = [];
  let guard = 0;
  const take = (m) => { if (m && m.id && !seen.has(m.id)) { seen.add(m.id); out.push(toItem(m, cat.type)); } };

  if (genres.length <= 1) {
    const g = genres[0] || "", key = g || "_";
    const page = await pageOf(cat, g, st.skips[key] || 0);
    if (!page || !page.length) { st.exhausted = true; return out; }
    st.skips[key] = (st.skips[key] || 0) + page.length;
    page.forEach(take);
    return out;
  }

  if (mode === "any") {
    while (out.length < want && guard++ < 6 && !st.exhausted) {
      const pages = await Promise.all(genres.map((g) => pageOf(cat, g, st.skips[g] || 0)));
      let got = false;
      genres.forEach((g, i) => { if (pages[i] && pages[i].length) { st.skips[g] = (st.skips[g] || 0) + pages[i].length; got = true; } });
      if (!got) { st.exhausted = true; break; }
      const longest = Math.max(...pages.map((p) => (p ? p.length : 0)));
      for (let i = 0; i < longest; i++) pages.forEach((p) => { if (p && p[i]) take(p[i]); });
    }
    return out;
  }

  const ordered = byRarity(genres);
  const primary = ordered[0], rest = ordered.slice(1);
  while (out.length < want && guard++ < 12 && !st.exhausted) {
    const page = await pageOf(cat, primary, st.skips[primary] || 0);
    if (!page || !page.length) { st.exhausted = true; break; }
    st.skips[primary] = (st.skips[primary] || 0) + page.length;
    const unknown = [];
    for (const m of page) {
      const gs = genresOf(m);
      if (!gs) { unknown.push(m); continue; }
      if (rest.every((g) => gs.includes(g.toLowerCase()))) take(m);
    }
    if (unknown.length) {
      await loadSets(cat, rest, st);
      unknown.forEach((m) => { if (rest.every((g) => st.sets[g] && st.sets[g].has(m.id))) take(m); });
    }
  }
  return out;
}

function resetDiscover() {
  discover.items = [];
  discover.seen = new Set();
  discover.st = { skips: {}, sets: {}, exhausted: false };
}

function showDiscover() {
  setNav("discover"); view = null;
  const cats = visibleCatalogs("discover");
  if (!cats.length) {
    app.innerHTML = `<h2>Discover</h2><p class="muted">No catalogs are turned on for Discover. Turn some on in Settings, then Catalogs.</p>`;
    return;
  }
  if (!cats.some((c) => c.key === discover.key)) { discover.key = cats[0].key; discover.genres = []; }
  const cat = () => cats.find((c) => c.key === discover.key);

  app.innerHTML = `<h2>Discover</h2>
    <div class="filters"><select id="dcat" aria-label="Catalog">${cats.map((c) =>
      `<option value="${esc(c.key)}" ${c.key === discover.key ? "selected" : ""}>${esc(c.title)}</option>`).join("")}</select>
      <span id="dmodebox"></span></div>
    <div class="chips" id="dchips"></div>
    <p class="muted" id="dsummary"></p>
    <div class="grid" id="dgrid"></div><div style="margin-top:24px" id="dmore"></div>`;

  const drawChips = () => {
    const c = cat(), box = $("#dchips");
    if (!c.genres) { box.innerHTML = `<span class="muted">This catalog has no genres to pick from.</span>`; $("#dmodebox").innerHTML = ""; return; }
    discover.genres = discover.genres.filter((g) => c.genres.includes(g));
    box.innerHTML = c.genres.map((g) =>
      `<button class="chip ${discover.genres.includes(g) ? "on" : ""}" data-g="${esc(g)}" aria-pressed="${discover.genres.includes(g)}">${esc(g)}</button>`).join("") +
      (discover.genres.length ? `<button class="chip mix" id="dclear">Clear</button>` : "");
    box.querySelectorAll("[data-g]").forEach((b) => {
      b.onclick = () => {
        const g = b.dataset.g;
        discover.genres = discover.genres.includes(g) ? discover.genres.filter((x) => x !== g) : discover.genres.concat(g);
        drawChips();
        load(false);
      };
    });
    const cl = $("#dclear");
    if (cl) cl.onclick = () => { discover.genres = []; drawChips(); load(false); };
    $("#dmodebox").innerHTML = discover.genres.length > 1
      ? `<select id="dmode" aria-label="How to combine genres">
           <option value="all" ${discover.mode === "all" ? "selected" : ""}>Must match all selected genres (mix)</option>
           <option value="any" ${discover.mode === "any" ? "selected" : ""}>Match any selected genre</option></select>`
      : "";
    const dm = $("#dmode");
    if (dm) dm.onchange = (e) => { discover.mode = e.target.value; load(false); };
  };

  let token = 0;
  const load = async (more) => {
    const mine = ++token;
    if (!more) { resetDiscover(); $("#dgrid").innerHTML = ""; }
    const c = cat(), moreBox = $("#dmore");
    const label = discover.genres.length > 1 ? (discover.mode === "all" ? discover.genres.join(" + ") : discover.genres.join(" or ")) : discover.genres[0] || "";
    $("#dsummary").textContent = label ? `Showing: ${label}` : "";
    moreBox.innerHTML = `<span class="muted">${discover.genres.length > 1 && discover.mode === "all" ? "Searching for titles that fit every genre…" : "Loading…"}</span>`;
    let fresh = [];
    try { fresh = await fetchDiscover(c, discover.genres, discover.mode, discover.st, discover.seen); }
    catch (e) { moreBox.innerHTML = `<span class="muted">Could not load this list. Check your internet connection.</span>`; return; }
    if (mine !== token) return;     // a newer choice replaced this one
    discover.items = discover.items.concat(fresh);
    fillCards($("#dgrid"), discover.items);
    if (discover.st.exhausted && !fresh.length) {
      moreBox.innerHTML = `<span class="muted">${discover.items.length ? "That is everything I could find." : "Nothing matched. Try fewer genres or “Match any”."}</span>`;
    } else {
      moreBox.innerHTML = `<button class="btn quiet" id="loadmore">Load more</button> <span class="muted">${discover.items.length} found so far</span>`;
      $("#loadmore").onclick = () => load(true);
    }
  };

  $("#dcat").onchange = (e) => { discover.key = e.target.value; discover.genres = []; drawChips(); load(false); };
  drawChips();
  load(false);
}

let lastSearch = "";

function searchSources() {
  const list = builtinCatalogs().map((c) => ({ cat: c, label: (c.type === "movie" ? "Movies" : "Series") + " · Built-in" }));
  for (const c of addonCatalogs(profile.addons)) {

function showSearch() {
  setNav("search"); view = null;
  app.innerHTML = `<h2>Search</h2>
    <div class="search-wrap"><div class="searchbar"><input id="q" type="search" role="combobox" aria-autocomplete="list" aria-controls="searchSuggestions" aria-expanded="false" placeholder="Movie, show, actor or director · Ctrl+K to search" autocomplete="off" value="${esc(lastSearch)}">
    <button class="btn" id="go">Search</button></div><div id="searchSuggestions" class="search-suggestions" role="listbox" hidden></div></div>
    <section class="row" id="recent-movies"><h2>Recently released movies</h2><div class="scroller"><span class="muted">Loading recent releases…</span></div></section>
    <div id="results"></div>`;
  const input = $("#q"), suggestions = $("#searchSuggestions");
  input.focus();
  let suggestionTimer = 0, suggestionRequest = 0;
  const closeSuggestions = () => { suggestions.hidden = true; input.setAttribute("aria-expanded", "false"); };
  const chooseSuggestion = (item) => { closeSuggestions(); input.value = item.name; lastSearch = item.name; go(() => showDetail(item.type, item.id, item)); };
  const updateSuggestions = async () => {
    const q = input.value.trim(), request = ++suggestionRequest;
    if (q.length < 2) { closeSuggestions(); return; }
    const sources = searchSources().slice(0, 8);
    const responses = await Promise.all(sources.map((src) =>
      getCached(catalogURL(src.cat, { search: q })).then((d) => (d.metas || []).map((m) => toItem(m, src.cat.type))).catch(() => [])));
    if (request !== suggestionRequest || input.value.trim() !== q) return;
    const seen = new Set(), items = [];
    for (const item of responses.flat()) {
      const key = item.id || item.name;
      if (!key || seen.has(key)) continue;
      seen.add(key); items.push(item);
      if (items.length >= 7) break;
    }
    suggestions.innerHTML = items.map((item, i) => `<button type="button" role="option" aria-selected="false" data-suggestion="${i}">
      ${item.poster ? `<img src="${esc(item.poster)}" alt="" loading="lazy">` : ""}
      <span class="suggestion-copy"><span class="suggestion-title">${esc(item.name)}</span><br><span class="suggestion-meta">${esc(item.type === "series" ? "Series" : "Movie")}${item.year ? " · " + esc(item.year) : ""}</span></span></button>`).join("");
    suggestions.hidden = !items.length;
    input.setAttribute("aria-expanded", String(items.length > 0));
    suggestions.querySelectorAll("[data-suggestion]").forEach((button) => {
      button.onclick = () => chooseSuggestion(items[Number(button.dataset.suggestion)]);
    });
  };
  const run = async () => {
    const q = input.value.trim();
    if (!q) return;
    closeSuggestions(); suggestionRequest++;
    lastSearch = q;
    const box = $("#results");
    box.innerHTML = "";
    const found = [];
    let pending = 0;
    const sources = searchSources();
    pending = sources.length;
    const tools = document.createElement("div");
    tools.className = "btns";
    box.appendChild(tools);
    for (const src of sources) {
      const section = document.createElement("section");
      section.className = "row";
      section.style.display = "none";
      section.innerHTML = `<h2>${esc(src.label)}</h2><div class="scroller"></div>`;
      box.appendChild(section);
      getCached(catalogURL(src.cat, { search: q }))
        .then((d) => {
          const items = (d.metas || []).map((m) => toItem(m, src.cat.type));
          if (!items.length) return;
          items.forEach((it) => { if (!found.some((f) => f.id === it.id)) found.push(it); });
          section.style.display = "";
          fillCards(section.querySelector(".scroller"), items);
          tools.innerHTML = `<button class="btn quiet" id="saveall">Save all ${found.length} results to a list</button>`;
          $("#saveall").onclick = async () => {
            const list = await listChooser(found.length);
            if (!list) return;
            found.forEach((it) => addToList(list, it));
            save();
            toast(`Saved ${found.length} titles to “${list.name}”.`);
          };
        })
        .catch(() => {})
        .finally(() => {
          pending--;
          if (pending === 0 && !found.length) box.insertAdjacentHTML("beforeend", `<p class="muted">Nothing found for “${esc(q)}”. Try another spelling.</p>`);
        });
    }
  };
  $("#go").onclick = run;
  input.addEventListener("input", () => {
    clearTimeout(suggestionTimer);
    suggestionTimer = setTimeout(updateSuggestions, 350);
  });
  input.onkeydown = (e) => {
    if (e.key === "Enter") { e.preventDefault(); run(); }
    else if (e.key === "ArrowDown" && !suggestions.hidden) {
      e.preventDefault(); suggestions.querySelector("button")?.focus();
    } else if (e.key === "Escape") closeSuggestions();
  };
  suggestions.onkeydown = (e) => {
    if (e.key === "Escape") { closeSuggestions(); input.focus(); }
    if (e.key === "ArrowUp" && e.target === suggestions.querySelector("button")) { e.preventDefault(); input.focus(); }
  };
  if (lastSearch) run();

  const recentBox = $("#recent-movies .scroller");
  const recentCatalogs = addonCatalogs(profile.addons).filter((cat) =>
    cat.type === "movie" && /recent|latest|new release|new movie/i.test(`${cat.title} ${cat.id}`)).slice(0, 3);
  const movieCatalog = builtinCatalogs().find((cat) => cat.type === "movie");
  if (!recentCatalogs.length) recentCatalogs.push(movieCatalog);
  else recentCatalogs.unshift(movieCatalog);
  Promise.all(recentCatalogs.map((cat) => getCached(catalogURL(cat)).then((d) =>
    (d.metas || []).map((m) => toItem(m, "movie"))).catch(() => [])))
    .then((lists) => {
      const byId = new Map();
      lists.flat().forEach((item) => { if (item.id && !byId.has(item.id)) byId.set(item.id, item); });
      const cutoffYear = new Date().getFullYear() - 2;
      const released = [...byId.values()].map((item) => {
        const match = String(item.year || "").match(/(19|20)\d{2}/);
        return { item, year: match ? Number(match[0]) : 0 };
      }).filter((entry) => entry.year >= cutoffYear)
        .sort((a, b) => b.year - a.year).slice(0, 20).map((entry) => entry.item);
      if (released.length) fillCards(recentBox, released);
      else $("#recent-movies").remove();
    });
}

const metaCache = new Map();

async function fetchMeta(type, id) {
  const key = type + "|" + id;
  if (metaCache.has(key)) return metaCache.get(key);
  const bases = [];
  const pref = profile.settings.metaAddon;
  const preferred = profile.addons.find((a) => addonBase(a.url) === pref);
  if (preferred && addonSupports(preferred, "meta", type, id)) bases.push(addonBase(preferred.url));
  bases.push(CINEMETA);
  for (const a of profile.addons) {
    if (addonSupports(a, "meta", type, id) && !bases.includes(addonBase(a.url))) bases.push(addonBase(a.url));
  }
  for (const base of bases) {
    try {
      const d = await getJSON(`${base}/meta/${type}/${enc(id)}.json`);
      if (d && d.meta) { metaCache.set(key, d.meta); return d.meta; }
    } catch (e) { /* try the next one */ }
  }
  return null;
}

function epSort(a, b) {
  const sa = a.season === 0 ? 9999 : a.season, sb = b.season === 0 ? 9999 : b.season;
  return sa - sb || a.episode - b.episode;
}
function nextEpisode(episodes, videoId) {
  const i = episodes.findIndex((e) => e.id === videoId);
  return i >= 0 && i + 1 < episodes.length && episodes[i + 1].season !== 0 ? episodes[i + 1] : null;
}
function epLabel(e) { return `S${e.season}E${e.episode}`; }

function peopleOf(meta) {
  const extras = meta.app_extras || {};
  const names = (v) => (Array.isArray(v) ? v : v ? [v] : []).map((x) => (typeof x === "string" ? { name: x } : x)).filter((x) => x && x.name);
  let cast = names(extras.cast);
  if (!cast.length) cast = names(meta.cast);
  return { cast, directors: names(extras.directors).length ? names(extras.directors) : names(meta.director), writers: names(extras.writers).length ? names(extras.writers) : names(meta.writer) };
}
function trailerOf(meta) {
  const ts = (meta.trailerStreams || []).find((t) => t.ytId);
  if (ts) return ts.ytId;
  const t = (meta.trailers || []).find((x) => x.source);
  return t ? t.source : "";
}

async function showDetail(type, id, hint, opts) {

    return;

  const episodes = type === "series"

        id: v.id || `${record.id}:${v.season}:${v.episode}`, season: Number(v.season), episode: Number(v.episode),
        title: v.title || v.name || `Episode ${v.episode}`, overview: v.overview || v.description || "" })).sort(epSort)
    : [];
  const people = peopleOf(meta);
  const trailer = trailerOf(meta);
  const genres = meta.genres || [];
  const facts = [meta.releaseInfo || meta.year, meta.runtime, meta.imdbRating ? "IMDb " + meta.imdbRating : ""].filter(Boolean).join("   ");
  let season = null;

  const bgImg = meta.background || "";
  app.innerHTML = `<div class="dhero">
      <div class="dbg" style="${bgImg ? `background-image:url('${cssUrl(bgImg)}')` : ""}"></div><div class="dshade"></div>
      <div class="dtop">${backButton()}</div>

        ${meta.poster ? `<img class="dposter" src="${esc(meta.poster)}" alt="">` : ""}

      .then((lists) => {
