// =====================================================================
//  Streams and playback
// =====================================================================
function isPlayable(s) { return !!s && (isWeb(s.url) || !!s.ytId); }

// Asks every stream add-on. `first` resolves with the best playable stream,
// respecting add-on order (an add-on lower in the list never beats one above it).
function streamScore(stream, addon, addonIndex) {
  const settings = profile.settings || {};
  const label = `${stream.name || ""} ${stream.title || ""} ${stream.description || ""}`.toLowerCase();
  const rules = String(settings.streamRules || "").split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
  for (const raw of rules) {
    const mode = raw[0] === "+" || raw[0] === "-" ? raw[0] : "+";
    const pattern = raw[0] === "+" || raw[0] === "-" ? raw.slice(1).trim() : raw;
    if (!pattern) continue;
    try { if (new RegExp(pattern, "i").test(label) && mode === "-") return -200000; } catch (e) { /* invalid patterns are ignored */ }
  }
  const q = label.match(/(?:2160p|4k|uhd|1080p|720p|480p|360p)/g) || [];
  const quality = q.some(x => /2160|4k|uhd/.test(x)) ? 2160 : q.some(x => /1080/.test(x)) ? 1080 : q.some(x => /720/.test(x)) ? 720 : q.some(x => /480/.test(x)) ? 480 : q.some(x => /360/.test(x)) ? 360 : 0;
  const max = Number(settings.maxQuality || 2160), min = settings.minQuality === "any" ? 0 : Number(settings.minQuality || 0);
  if (quality && quality > max) return -100000;
  if (quality && quality < min) return -50000 + quality;
  let score = settings.bestStream === false ? -addonIndex * 10000 : quality * 2 - addonIndex * 20;
  const seeds = Number(stream.behaviorHints && (stream.behaviorHints.videoHash ? stream.behaviorHints.seeders : 0) || stream.seeders || 0);
  score += Math.min(seeds, 500) * 2;
  if (!quality && settings.bestStream !== false) score -= 100; // prefer sources with explicit quality labels over unknown quality
  if (/hevc|h265|x265/.test(label)) score += 20;
  if (/hdr|dolby vision|\bdv\b/.test(label)) score += 10;
  if (/cam|telesync|hdcam|workprint/.test(label)) score -= 1000;
  if (/torrent|magnet:|\.torrent\b/.test(label) && !isWeb(stream.url)) score -= 10000;
  for (const raw of rules) {
    const mode = raw[0] === "+" || raw[0] === "-" ? raw[0] : "+";
    const pattern = raw[0] === "+" || raw[0] === "-" ? raw.slice(1).trim() : raw;
    if (!pattern || mode !== "+") continue;
    try { if (new RegExp(pattern, "i").test(label)) score += 500; } catch (e) { /* invalid patterns are ignored */ }
  }
  return score;
}
function runStreams(type, id, onAddon) {
  const addons = profile.addons.filter((a) => addonSupports(a, "stream", type, id));
  const results = new Array(addons.length).fill(undefined);
  const first = new Promise((resolve) => {
    if (!addons.length) { resolve(null); return; }
    let remaining = addons.length, settled = false;
    const check = () => {
      if (remaining > 0 || settled) return;
      const candidates = [];
      results.forEach((list, i) => (list || []).forEach(stream => { if (isPlayable(stream)) { const score = streamScore(stream, addons[i], i); if (score > -100000) candidates.push({stream, addon:addons[i], score}); } }));
      candidates.sort((a,b) => b.score - a.score);
      settled = true;
      resolve(candidates.length ? {stream:candidates[0].stream, addon:candidates[0].addon} : null);
    };
    addons.forEach((addon, i) => {
      getJSON(`${addonBase(addon.url)}/stream/${type}/${enc(id)}.json`)
        .then((d) => d.streams || []).catch(() => [])
        .then((list) => { results[i] = list; remaining--; if (onAddon) onAddon(addon, list); check(); });
    });
  });
  return { addons, first };
}

let streamToken = 0;
const MAX_AUTOPLAY_BYTES = 10 * 1024 * 1024 * 1024;
function streamSizeBytes(stream) {
  const values = [stream && stream.behaviorHints && stream.behaviorHints.videoSize, stream && stream.fileSize, stream && stream.videoSize, stream && stream.size];
  for (const value of values) {
    if (typeof value === "number" && Number.isFinite(value) && value > 0) return value;
    if (typeof value === "string") {
      const match = value.trim().match(/^([\d.]+)\s*(B|KB|MB|GB|TB)?$/i);
      if (match) {
        const amount = Number(match[1]), unit = (match[2] || "B").toUpperCase();
        const factor = {B:1,KB:1024,MB:1024**2,GB:1024**3,TB:1024**4}[unit];
        if (Number.isFinite(amount) && factor) return amount * factor;
      }
    }
  }
  const text = `${stream && stream.name || ""} ${stream && stream.title || ""} ${stream && stream.description || ""}`;
  const match = text.match(/\b([\d.]+)\s*(TB|GB|MB)\b/i);
  if (match) return Number(match[1]) * ({MB:1024**2,GB:1024**3,TB:1024**4}[match[2].toUpperCase()]);
  return null;
}
function streamQuality(stream) {
  const label = `${stream.name || ""} ${stream.title || ""} ${stream.description || ""}`;
  const found = label.match(/2160p|4k|uhd|1080p|720p|480p|360p/i);
  if (!found) return "Other / unknown quality";
  const q = found[0].toLowerCase();
  return /2160|4k|uhd/.test(q) ? "4K / 2160p" : /1080/.test(q) ? "1080p" : /720/.test(q) ? "720p" : "SD";
}
function bestKnownSmall(records) {
  return records.filter((r) => {
    const size = streamSizeBytes(r.stream);
    return size != null && size <= MAX_AUTOPLAY_BYTES && isPlayable(r.stream);
  }).sort((a,b) => streamScore(b.stream,b.addon,b.addonIndex)-streamScore(a.stream,a.addon,a.addonIndex))[0] || null;
}
async function openStreams(ctx, auto, showPopup) {
  const token = ++streamToken;
  const box = $("#streams");
  const setup = (panel, close) => {
    let records = [], scraping = 0;
    panel.innerHTML = `<h3>${esc(ctx.title)}</h3>
      <p class="muted" id="streamStatus">Finding sources…</p>
      <div class="btns"><button class="btn quiet small" id="rescrape">Rescrape</button><button class="btn quiet small" id="streamClose">Close</button></div>
      <div class="stream-groups" id="streamGroups"></div>`;
    panel.querySelector("#streamClose").onclick = () => close(null);
    const render = () => {
      const groups = new Map();
      records.forEach((r) => {
        const quality = streamQuality(r.stream);
        if (!groups.has(quality)) groups.set(quality, []);
        groups.get(quality).push(r);
      });
      const order = ["4K / 2160p","1080p","720p","SD","Other / unknown quality"];
      const container = panel.querySelector("#streamGroups");
      container.innerHTML = "";
      order.forEach((quality) => {
        const items = groups.get(quality) || [];
        if (!items.length) return;
        const section = document.createElement("section");
        section.className = "quality-group";
        section.innerHTML = `<h4>${esc(quality)}</h4><div class="quality-list"></div>`;
        const list = section.querySelector(".quality-list");
        items.forEach((r) => list.appendChild(streamRow(r.stream, r.addon, ctx, () => close(null))));
        container.appendChild(section);
      });
    };
    const scrape = () => {
      const current = ++streamToken;
      records = [];
      panel.querySelector("#streamGroups").innerHTML = "";
      panel.querySelector("#streamStatus").textContent = "Rescraping add-ons for sources…";
      const session = runStreams(ctx.type, ctx.videoId, (addon, list) => {
        if (current !== streamToken || !panel.isConnected) return;
        const addonIndex = session.addons.indexOf(addon);
        list.forEach((stream) => records.push({stream,addon,addonIndex}));
        render();
      });
      scraping = current;
      if (!session.addons.length) {
        panel.querySelector("#streamStatus").textContent = "No stream add-ons are installed for this title.";
        return;
      }
      panel.querySelector("#streamStatus").textContent = `Searching ${session.addons.length} add-on(s)…`;
      session.first.then((result) => {
        if (current !== streamToken || !panel.isConnected) return;
        const status = panel.querySelector("#streamStatus");
        if (!records.some((r) => isPlayable(r.stream))) status.textContent = "No playable links found. Try rescraping or check your add-ons.";
        else status.textContent = `${records.filter((r) => isPlayable(r.stream)).length} links found. Choose a quality category.`;
        if (auto) {
          const eligible = bestKnownSmall(records);
          if (eligible) {
            close(null);
            playStream(eligible.stream, eligible.addon, ctx);
          } else {
            status.textContent += " Automatic playback needs a reported file size of 10 GB or less; choose a link to play manually.";
          }
        }
      });
    };
    panel.querySelector("#rescrape").onclick = scrape;
    scrape();
  };
  if (showPopup || !box) return modal((panel, close) => setup(panel, close));
  return modal((panel, close) => setup(panel, close));
}
function streamRow(s, addon, ctx, closePicker) {
  let url = s.url;
  if (!url && s.ytId) url = "https://www.youtube.com/watch?v=" + s.ytId;
  const label = (s.name || addon.name || "Stream").replace(/\s+/g, " ");
  const detail = s.title || s.description || "";
  const playable = isPlayable(s);
  const size = streamSizeBytes(s);
  const sizeLabel = size == null ? "Size unknown" : size <= MAX_AUTOPLAY_BYTES ? `${(size / 1024**3).toFixed(1)} GB` : `${(size / 1024**3).toFixed(1)} GB · over auto-play limit`;
  const el = document.createElement(playable ? "button" : "div");
  el.className = "item" + (playable ? "" : " off");
  el.innerHTML = `<div class="grow"><div>${esc(label)}</div><div class="small">${esc(detail)} · ${esc(addon.name || "Add-on")} · ${esc(sizeLabel)}</div></div>
    <span class="tag">${playable ? esc(streamQuality(s)) : "Torrent only, not supported"}</span>`;
  if (playable) el.onclick = () => { if (closePicker) closePicker(); playStream(s, addon, ctx); };
  return el;
}

async function collectSubs(stream, ctx) {
  const out = [], seen = new Set();
  const add = (list) => {
    for (const sub of list || []) {
      if (!sub || !isWeb(sub.url) || seen.has(sub.url)) continue;
      seen.add(sub.url);
      out.push({url:sub.url,lang:sub.lang || sub.language || "und",label:sub.label || sub.name || ""});
    }
  };
  add(stream.subtitles);
  if (!ctx.noTrack) {
    const addons = profile.addons.filter((a) => addonSupports(a, "subtitles", ctx.type, ctx.videoId));
    await Promise.all(addons.map((a) =>
      getJSON(`${addonBase(a.url)}/subtitles/${ctx.type}/${enc(ctx.videoId)}.json`, 5000).then((d) => add(d.subtitles)).catch(() => {})));
  }
  return out.slice(0, 24);
}

let watching = null;   // { playId, ctx, lastSave }

async function playStream(stream, addon, ctx) {
  let url = stream.url;
  const sizeBytes = streamSizeBytes(stream);
  ctx = Object.assign({}, ctx, { sizeBytes, autoEligible: sizeBytes != null && sizeBytes <= MAX_AUTOPLAY_BYTES });
  if (!isWeb(url) && stream.ytId) url = "https://www.youtube.com/watch?v=" + stream.ytId;
  if (!isWeb(url)) { toast("That source cannot be played.", true); return; }
  const headers = [];
  const ph = stream.behaviorHints && stream.behaviorHints.proxyHeaders && stream.behaviorHints.proxyHeaders.request;
  if (ph && typeof ph === "object") Object.keys(ph).forEach((k) => headers.push(`${k}: ${ph[k]}`));
  const subs = await collectSubs(stream, ctx);
  await startPlayer(url, ctx, subs, headers);
}
function playUrl(url, title, ctx) { return startPlayer(url, Object.assign({}, ctx, { title }), [], []); }

async function startPlayer(url, ctx, subs, headers) {

  const startAt = ctx.noTrack || ctx.fromStart ? 0 : (resumeAt(ctx.videoId) > 0 ? resumeAt(ctx.videoId) : (ctx.type === "series" && s.skipIntro ? Number(s.skipIntroSeconds || 0) : 0));

    <video id="bfvideo" controls autoplay playsinline preload="auto"></video>
    <div class="player-message" id="player-message" role="status"></div>
    <div class="player-actions"><label>Audio <select id="player-audio"><option value="">System default</option></select></label><label>Subtitles <select id="player-subtitles"><option value="-1">Off</option></select></label><button class="btn quiet small" id="player-mpv">Try external player</button></div>`;

    await startExternalPlayer(url, ctx, subs, headers, startAt);
  };
  const audioSelect = overlay.querySelector("#player-audio"), subtitleSelect = overlay.querySelector("#player-subtitles");
  const refreshTrackChoices = () => {
    const audioTracks = video.audioTracks;
    audioSelect.innerHTML = '<option value="">System default</option>';
    if (audioTracks && audioTracks.length) {

      });
    } else {
      const option = document.createElement("option");
      option.disabled = true; option.textContent = "No selectable audio tracks reported by this source";
      audioSelect.appendChild(option);
    }
    const textTracks = video.textTracks;
    subtitleSelect.innerHTML = '<option value="-1">Off</option>';
    Array.from(textTracks).forEach((track, i) => {
      const option = document.createElement("option");
      option.value = String(i); option.textContent = track.label || track.language || `Subtitle ${i + 1}`;
      subtitleSelect.appendChild(option);
      track.mode = (!s.subsOff && (langMatches(track.language, s.slang) || (i === 0 && !s.slang))) ? "showing" : "disabled";
      if (track.mode === "showing") subtitleSelect.value = String(i);
    });
  };
  audioSelect.onchange = () => {
    const tracks = video.audioTracks;
    if (!tracks || !tracks.length) return;
    Array.from(tracks).forEach((track, i) => { track.enabled = audioSelect.value === "" ? i === 0 : i === Number(audioSelect.value); });
  };
  subtitleSelect.onchange = () => Array.from(video.textTracks).forEach((track, i) => { track.mode = Number(subtitleSelect.value) === i ? "showing" : "disabled"; });
  subs.slice(0, 24).forEach((sub, i) => {
    const url = typeof sub === "string" ? sub : sub.url;
    if (!isWeb(url)) return;
    const track = document.createElement("track");
    track.kind = "subtitles"; track.src = url;
    track.srclang = (typeof sub === "object" && (sub.lang || sub.language)) || langList(s.slang).split(",")[0] || "en";
    track.label = (typeof sub === "object" && (sub.label || sub.lang || sub.language)) || `Subtitle ${i + 1}`;
    track.default = !s.subsOff && i === 0; video.appendChild(track);
  });
  video.addEventListener("loadedmetadata", refreshTrackChoices, { once: true });
  video.textTracks.addEventListener && video.textTracks.addEventListener("addtrack", refreshTrackChoices);
  if (video.audioTracks && video.audioTracks.addEventListener) video.audioTracks.addEventListener("addtrack", refreshTrackChoices);

  video.addEventListener("loadedmetadata", () => {
    if (startAt >= 5 && Number.isFinite(video.duration) && startAt < video.duration - 5) video.currentTime = startAt;
  }, { once: true });
  let lastSave = 0;
  video.addEventListener("timeupdate", () => {
    if (ctx.noTrack || !(video.duration > 0)) return;
    recordProgress(ctx, video.currentTime, video.duration);
    if (Date.now() - lastSave > 10000) { lastSave = Date.now(); save(); }
  });
  video.addEventListener("ended", () => {
    const pos = video.currentTime || 0, dur = video.duration || 0;
    if (!ctx.noTrack && dur > 0) { recordProgress(ctx, pos, dur); save(); }
    close();
    const next = ctx.episodes ? nextEpisode(ctx.episodes, ctx.videoId) : null;
    if (next && ctx.autoEligible && profile.settings.autoplayNext) countdownNext(ctx, next);
  });
  video.addEventListener("error", () => {
    overlay.querySelector("#player-message").textContent = "This stream could not be played inside BradsHub. Try the external player, or choose another source.";
  });
  if (!ctx.noTrack) addHistory(ctx);
  toast("Playing inside BradsHub");
  video.play().catch(() => { overlay.querySelector("#player-message").textContent = "Press Play on the video controls to start."; });
}

async function startExternalPlayer(url, ctx, subs, headers, startAt) {
  const s = profile.settings;
  const body = { url, title: ctx.title, key: ctx.noTrack ? "" : ctx.videoId, start: startAt,
    alang: langList(s.alang), slang: langList(s.slang), subsOff: !!s.subsOff, subs, headers };
  try {
    const res = await fetch("/api/play", { method: "POST", body: JSON.stringify(body) });
    const data = await res.json();
    if (!res.ok) { toast(data.error || "Could not start playback.", true); return; }
    toast("Opening in mpv…");
    if (!ctx.noTrack) watching = { playId: data.id, ctx, lastSave: 0, profile };
  } catch (e) { toast("Could not reach the app. Is it still running?", true); }
}

async function pollPlayer() {
  if (!watching) return;
  let st;
  try { st = await getJSON("/api/player", 4000); } catch (e) { return; }
  const w = watching;
  if (!w || st.id !== w.playId) { if (w && st.id > w.playId) watching = null; return; }
  recordProgress(w.ctx, st.pos, st.dur, w.profile);
  if (st.active) {
    if (Date.now() - w.lastSave > 10000) { w.lastSave = Date.now(); save(); }
    return;
  }
  watching = null;
  save();
  if (view && view.refresh && profile) view.refresh();
  const next = w.ctx.episodes ? nextEpisode(w.ctx.episodes, w.ctx.videoId) : null;
  if (next && profile === w.profile && profile.settings.autoplayNext && finishedNums(st.pos, st.dur)) countdownNext(w.ctx, next);
}
setInterval(pollPlayer, 2000);

function countdownNext(prev, next) {
  let left = 8;
  const el = document.createElement("div");
  el.className = "countdown";
  el.innerHTML = `<span id="cdtxt"></span><button class="btn quiet small" id="cdno">Cancel</button>`;
  document.body.appendChild(el);
  const text = () => { el.querySelector("#cdtxt").textContent = `Next: ${epLabel(next)} ${next.title} in ${left}s`; };
  text();
  const stop = () => { clearInterval(timer); el.remove(); };
  const timer = setInterval(() => {
    left--;
    if (left <= 0) { stop(); playNext(prev, next); } else text();
  }, 1000);
  el.querySelector("#cdno").onclick = stop;
}
async function playNext(prev, next) {
  const ctx = Object.assign({}, prev, { videoId: next.id, title: `${prev.record.name} ${epLabel(next)}`,
    season: next.season, episode: next.episode, fromStart: false });
  const records = [];
  const session = runStreams(ctx.type, ctx.videoId, (addon, streams) => {
    const addonIndex = session.addons.indexOf(addon);
    streams.forEach((stream) => records.push({stream,addon,addonIndex}));
  });
  await session.first;
  const result = bestKnownSmall(records);
  if (!result) { toast("The next episode has no source with a reported size of 10 GB or less. Choose it manually.", true); return; }
  playStream(result.stream, result.addon, ctx);
}

// =====================================================================
//  Add-ons (with automatic updates)
// =====================================================================
async function refreshAddons(silent) {
  if (!profile || !profile.addons.length) { if (!silent) toast("No add-ons to update."); return; }
  let changed = 0, failed = 0;
  await Promise.all(profile.addons.map(async (a) => {
    try {
      const m = await getJSON(normalizeManifestUrl(a.url), 10000);
      if (m && m.id && m.resources) {
        if (JSON.stringify(m) !== JSON.stringify(a.manifest)) { a.manifest = m; a.name = m.name || a.name; changed++; }
        a.checkedAt = Date.now();
      } else failed++;
    } catch (e) { failed++; }
  }));
  if (changed || !silent) save();
  if (!silent) toast(failed ? `Updated ${changed}. ${failed} could not be reached.` : changed ? `Updated ${changed} add-on(s).` : "All add-ons are up to date.", failed > 0 && !changed);
}

const SAFE_VALUE = /^[#\w\s,.%()\/+\-]+$/;

let themeEl = null;
function allThemes() { return THEME_PRESETS.concat(state.themes || []); }
function currentTheme() { return allThemes().find((t) => t.id === state.themeId) || THEME_PRESETS[0]; }

// Removes the few things in CSS that could pull in other files or run code.
function cleanCss(css) {
  return String(css || "")
    .replace(/@import[^;]*;?/gi, "")
    .replace(/<\/?style[^>]*>/gi, "")
    .replace(/expression\s*\(/gi, "")
    .replace(/javascript:/gi, "")
    .replace(/behavior\s*:/gi, "");
}

function applyTheme() {
  if (!themeEl) { themeEl = document.createElement("style"); themeEl.id = "theme-style"; document.head.appendChild(themeEl); }
  const t = currentTheme();
  const vars = Object.entries(t.vars || {})
    .filter(([k, v]) => /^--[\w-]+$/.test(k) && SAFE_VALUE.test(String(v)))
    .map(([k, v]) => `${k}:${v}`).join(";");
  let css = `:root{${vars}}`;
  const font = t.font && /^[\w\s,"'\-]+$/.test(t.font) ? t.font : (FONT_CHOICES[state.font] || FONT_CHOICES.modern);
  css += `body{font-family:${font}}`;
  const bg = t.bgImage;
  if (bg && /^(https:\/\/|data:image\/)/.test(bg) && !/["')\n\r]/.test(bg)) {
    css += `body{background-image:linear-gradient(rgba(0,0,0,.6),rgba(0,0,0,.6)),url("${bg}");background-size:cover;background-attachment:fixed}`;
  }
  css += "\n" + cleanCss(t.css) + "\n" + cleanCss(state.customCss);
  themeEl.textContent = css;
  document.body.dataset.layout = state.layout || "sidebar";
  document.body.dataset.cards = state.cards || "round";
}

// ---- reading a theme file ----
function normColor(v) {
  v = String(v).trim();
  if (/^#([0-9a-f]{3,4}|[0-9a-f]{6}|[0-9a-f]{8})$/i.test(v)) return v;
  if (/^(rgb|hsl)a?\([\d\s.,%\/-]+\)$/i.test(v)) return v;
  if (/^\d{1,3}(\.\d+)?\s+\d{1,3}(\.\d+)?%\s+\d{1,3}(\.\d+)?%$/.test(v)) return `hsl(${v})`;   // "220 14% 10%"
  return null;
}
// Which of our colours does a theme key most likely mean?
const TOKEN_RULES = [
  ["--accent-ink", /(accent|primary|brand).*(ink|fg|foreground|text|contrast)|on-?(accent|primary)/],
  ["--accent", /accent|primary|brand|highlight/],
  ["--muted", /muted|secondary-?text|text-?(2|secondary|dim|subtle)|subtle|dim/],
  ["--text", /text|foreground|(^|-)fg(-|$)|ink/],
  ["--line", /border|line|divider|outline|stroke/],
  ["--panel-hi", /(surface|panel|card|elevated|bg|background).*(hi|high|raised|hover|2|alt)|hover/],
  ["--panel", /surface|panel|card|elevated|sidebar|secondary/],
  ["--bg", /background|(^|-)bg(-|$)|base|canvas/],
];
function tokenFor(name) {
  const n = String(name).replace(/([a-z])([A-Z])/g, "$1-$2").toLowerCase().replace(/[_\s.]+/g, "-");
  for (const [token, re] of TOKEN_RULES) if (re.test(n)) return token;
  return null;
}

// Best-effort reader. Accepts JSON (any shape) or plain CSS.
function parseThemeText(text, filename) {
  const theme = { id: uid(), name: String(filename || "Imported theme").replace(/\.[^.]+$/, ""), vars: {}, css: "", font: "", bgImage: "", imported: true };
  let obj = null;
  try { obj = JSON.parse(text); } catch (e) { /* not JSON */ }

  if (!obj || typeof obj !== "object") {
    const source = String(text);
    // Harbor's .harborstyle format is section-based: front matter, @tokens, @css, @js.
    // Translate the supported visual parts; deliberately never execute @js.
    if (/@tokens\s*[\s\S]*?@css/i.test(source) || /^# Harbor Style/m.test(source)) {
      const head = source.split(/@tokens/i)[0];
      const name = head.match(/^name:\s*(.+)$/mi); if (name) theme.name = name[1].trim();
      const font = head.match(/^font:\s*(.+)$/mi); if (font) theme.font = font[1].trim();
      const sections = source.split(/@(tokens|css|js)\s*/i);
      let section = "";
      for (let i = 1; i < sections.length; i += 2) {
        section = String(sections[i]).toLowerCase(); const body = sections[i+1] || "";
        if (section === "tokens") {
          for (const line of body.split(/\r?\n/)) {
            const m = line.match(/^\s*(--[\w-]+)\s*:\s*(.*?)\s*;?\s*$/);
            if (!m) continue;
            const val = m[2].replace(/;$/, "").trim();
            const direct = {"--color-canvas":"--bg","--color-surface":"--panel","--color-elevated":"--panel-hi","--color-raised":"--panel-hi","--color-ink":"--text","--color-ink-muted":"--muted","--color-ink-subtle":"--muted","--color-edge":"--line","--color-edge-soft":"--line","--color-accent":"--accent","--color-accent-soft":"--panel-hi","--color-danger":"--bad"}[m[1]];
            const token = direct || tokenFor(m[1]); const color = normColor(val);
            if (token && color && !theme.vars[token]) theme.vars[token] = color;
          }
        } else if (section === "css") {
          // Only styles are imported. Strip @import and active content; @js is never run.
          theme.css += body.split(/@js/i)[0] + "\n";
          const f = body.match(/--font-(?:display|sans|channel)\s*:\s*([^;]+);/i); if (f && !theme.font) theme.font = f[1].trim();
        }
      }
      theme.css = cleanCss(theme.css);
      return theme;
    }
    theme.css = cleanCss(source);
    // Pull colours out of a :root { --name: #hex } block when there is one.
    const re = /(--[\w-]+)\s*:\s*([^;}]+)/g;
    let m;
    while ((m = re.exec(source))) {
      const color = normColor(m[2]), token = tokenFor(m[1]);
      if (color && token && !theme.vars[token]) theme.vars[token] = color;
    }
    return theme;
  }

  (function walk(o, path) {
    if (Array.isArray(o)) { o.forEach((v, i) => { if (v && typeof v === "object") walk(v, path.concat(String(i))); }); return; }
    for (const [k, v] of Object.entries(o)) {
      if (v && typeof v === "object") { walk(v, path.concat(k)); continue; }
      if (typeof v !== "string") continue;
      const here = path.concat(k), last2 = here.slice(-2).join("-");
      const color = normColor(v);
      if (color) {
        const token = tokenFor(last2) || tokenFor(k);
        if (token && !theme.vars[token]) theme.vars[token] = color;
      } else if (here.some((p) => /css|style/i.test(p)) && v.includes("{")) {
        theme.css += v + "\n";
      } else if (/^(name|title)$/i.test(k) && path.length <= 1 && v.length < 60) {
        theme.name = v;
      } else if (/font/i.test(k) && /^[\w\s,"'\-]+$/.test(v) && v.length < 120) {
        if (!theme.font) theme.font = v;
      } else if (/background|wallpaper|backdrop|image/i.test(k) && /^(https:\/\/|data:image\/)/.test(v)) {
        if (!theme.bgImage) theme.bgImage = v;
      }
    }
  })(obj, []);
  return theme;
}

function describeTheme(t) {
  const bits = [];
  const n = Object.keys(t.vars).length;
  if (n) bits.push(`${n} colour${n > 1 ? "s" : ""}`);
  if (t.font) bits.push("a font");
  if (t.bgImage) bits.push("a background image");
  if (t.css) bits.push("custom CSS");
  return bits;
}

      const file = e.target.files && e.target.files[0];
      if (!file) return;
      try { await importThemeFlow(await file.text(), file.name); draw(); }
      catch (err) { toast("Could not read that file.", true); }
    };
    $("#tpaste").onclick = async () => {
      const text = await modal((dlg, close) => {
        dlg.innerHTML = `<h3>Paste theme text</h3><textarea id="pt" spellcheck="false" placeholder="Paste the contents of a theme file here"></textarea>
          <div class="dlgrow"><button class="btn quiet" id="no">Cancel</button><button class="btn" id="ok">Continue</button></div>`;
        dlg.querySelector("#no").onclick = () => close(null);
        dlg.querySelector("#ok").onclick = () => close(dlg.querySelector("#pt").value);
        setTimeout(() => dlg.querySelector("#pt").focus(), 0);
      });
      if (text && text.trim()) { await importThemeFlow(text, "Pasted theme"); draw(); }
    };
  };
  draw();
}

let updatePromptOpen = false;
let updateCheckedThisRun = false;
async function checkLinuxUpdate(silent) {
  if (updateCheckedThisRun) return;
  updateCheckedThisRun = true;
  try {
    const result = await getJSON("/api/update/check", 20000);
    if (!result.ok) { if (!silent) toast(result.error || "Could not check for updates.", true); return; }
    if (!result.available) { if (!silent) toast(`BradsHub is up to date (v${result.current}).`); return; }
    if (!updatePromptOpen) { updatePromptOpen = true; showLinuxUpdatePrompt(result); }
  } catch (e) { if (!silent) toast("Could not check for updates. Check your internet connection and make sure curl is installed.", true); }
}

function showLinuxUpdatePrompt(info) {
  modal((box, close) => {
    box.innerHTML = `<h3>BradsHub ${esc(info.version)} is ready</h3>
      <p>A newer Linux build has been published. Your profiles and watch history are stored separately and will stay in place.</p>
      <p class="muted">BradsHub will verify the download checksum before replacing its app file. Restart BradsHub after installation to use the new version.</p>
      <p id="updatestatus" class="muted"></p>
      <div class="dlgrow"><button class="btn quiet" id="updatelater">Later</button><button class="btn" id="updateinstall">Download and install</button></div>`;
    box.querySelector("#updatelater").onclick = () => close(false);
    box.querySelector("#updateinstall").onclick = async () => {
      const button = box.querySelector("#updateinstall"), status = box.querySelector("#updatestatus");
      button.disabled = true; status.textContent = "Downloading and verifying the Linux update…";
      try {
        const response = await fetch("/api/update/install", { method: "POST" });
        const result = await response.json();
        if (!response.ok || !result.ok) throw new Error(result.error || "The update could not be installed.");
        box.innerHTML = `<h3>Update installed</h3><p>BradsHub ${esc(result.version)} is installed. Close and reopen BradsHub to start the updated version.</p><div class="dlgrow"><button class="btn" id="updatedone">OK</button></div>`;
        box.querySelector("#updatedone").onclick = () => close(true);
      } catch (e) { status.textContent = e.message || "The update could not be installed."; button.disabled = false; }
    };
  });
}

function settingsUpdates(box) {
  box.innerHTML = `<h3>Linux app updates</h3><p>BradsHub checks for a published Linux build when you open a profile. Updates are offered only after a successful GitHub Actions build has been manually published.</p>
    <p id="updateinfo" class="muted">Checking the installed version…</p><div class="btns"><button class="btn" id="updatecheck">Check now</button></div>
    <p class="hint">After installing an update, close and reopen BradsHub. If the app is installed in a system-owned folder, start BradsHub with an account that can replace that file or install the downloaded build manually.</p>`;
  const status = $("#updateinfo");
  const refresh = async (manual) => {
    status.textContent = "Checking GitHub for a published Linux build…";
    try {
      const result = await getJSON("/api/update/check", 20000);
      if (!result.ok) { status.textContent = result.error || "Could not check for updates."; return; }
      status.textContent = result.available ? `Installed v${result.current}. Linux update v${result.version} is available.` : `BradsHub v${result.current} is up to date.`;
      if (manual && result.available) { updatePromptOpen = true; showLinuxUpdatePrompt(result); }
    } catch (e) { status.textContent = "Could not reach GitHub. Check your internet connection and make sure curl is installed."; }
  };
  $("#updatecheck").onclick = () => refresh(true);
  refresh(false);
}

function settingsAddons(box) {
  box.innerHTML = `<div class="note">Add-ons are what find video links. BradsHub does not include any,
    so it only shows movie and show information until you add some. They stay up to date automatically.
    Only add add-ons from sources you trust, and that are legal where you live.</div>
    <div class="searchbar"><input id="url" type="text" placeholder="Paste an add-on link here" autocomplete="off">
    <button class="btn" id="add">Add</button></div>
    <div class="btns" style="margin-top:0"><button class="btn quiet small" id="updall">Update all now</button></div>
    <div class="list" id="addonlist"></div>`;
  const draw = () => {
    const list = $("#addonlist");
    if (!profile.addons.length) { list.innerHTML = `<p class="muted">No add-ons yet.</p>`; return; }
    list.innerHTML = profile.addons.map((a, i) => {
      const m = a.manifest || {};
      return `<div class="item"><div class="grow"><div>${esc(a.name)} ${m.version ? `<span class="tag">v${esc(m.version)}</span>` : ""}</div>
        <div class="small">${esc(resourceNames(m).join(", "))}${m.description ? "\n" + esc(String(m.description).slice(0, 140)) : ""}${a.checkedAt ? "\nChecked " + esc(fmtDate(a.checkedAt)) : ""}</div></div>
        <button class="btn quiet small" data-rm="${i}">Remove</button></div>`;
    }).join("");
    list.querySelectorAll("[data-rm]").forEach((b) => {
      b.onclick = () => { profile.addons.splice(Number(b.dataset.rm), 1); save(); draw(); };
    });
  };
  $("#add").onclick = async () => {
    const text = $("#url").value;
    if (!text.trim()) return;
    const url = normalizeManifestUrl(text);
    try {
      const manifest = await getJSON(url);
      if (!manifest || !manifest.id || !manifest.resources) throw new Error("not an add-on");
      profile.addons = profile.addons.filter((a) => addonBase(a.url) !== addonBase(url));
      profile.addons.push({ url, name: manifest.name || manifest.id, manifest, checkedAt: Date.now() });
      save();
      $("#url").value = "";
      toast("Added " + (manifest.name || manifest.id));
      draw();
    } catch (e) { toast("That link did not work as an add-on. Check it and try again.", true); }
  };
  $("#updall").onclick = async () => { await refreshAddons(false); draw(); };
  draw();
}

function settingsCatalogs(box) {
  box.innerHTML = `<p class="muted">Choose what appears on Home and Discover, reorder catalogs, and organize Home into custom sections.</p>
    <div class="list" id="cl"></div><h3>Home sections</h3><p class="muted">Create named rows to group related catalogs, for example “My favorites” or “Animation.”</p>
    <div class="inline"><input id="groupname" type="text" maxlength="48" placeholder="Section name"><button class="btn" id="groupadd">Create section</button></div><div class="list" id="grouplist" style="margin-top:14px"></div>`;
  const draw = () => {
    const cats = allCatalogs();
    $("#cl").innerHTML = cats.map((c, i) => `
      <div class="item"><div class="grow"><div>${esc(c.title)}</div><div class="small">${esc(c.type)}</div></div>
        <label class="tag"><input type="checkbox" data-h="${esc(c.key)}" ${profile.catalogs.home[c.key] !== false ? "checked" : ""}> Home</label>
        <label class="tag"><input type="checkbox" data-d="${esc(c.key)}" ${profile.catalogs.discover[c.key] !== false ? "checked" : ""}> Discover</label>
        <button class="btn quiet small" data-up="${i}" aria-label="Move up" ${i === 0 ? "disabled" : ""}>↑</button>
        <button class="btn quiet small" data-dn="${i}" aria-label="Move down" ${i === cats.length - 1 ? "disabled" : ""}>↓</button></div>`).join("");
    $("#cl").querySelectorAll("[data-h]").forEach((c) => { c.onchange = () => { profile.catalogs.home[c.dataset.h] = c.checked; save(); }; });
    $("#cl").querySelectorAll("[data-d]").forEach((c) => { c.onchange = () => { profile.catalogs.discover[c.dataset.d] = c.checked; save(); }; });
    const move = (i, dir) => {
      const keys = cats.map((c) => c.key);
      const j = i + dir;
      [keys[i], keys[j]] = [keys[j], keys[i]];
      profile.catalogs.order = keys;
      save(); draw();
    };
    $("#cl").querySelectorAll("[data-up]").forEach((b) => { b.onclick = () => move(Number(b.dataset.up), -1); });
    $("#cl").querySelectorAll("[data-dn]").forEach((b) => { b.onclick = () => move(Number(b.dataset.dn), 1); });
    const groups = profile.catalogGroups || [];
    $("#grouplist").innerHTML = groups.length ? groups.map((g, i) => `
      <div class="item" style="align-items:flex-start"><div class="grow"><label class="t" for="gn${i}">Section name</label><input id="gn${i}" type="text" maxlength="48" value="${esc(g.name)}"><div class="small" style="margin:8px 0">Choose catalogs in this section</div>
      <div class="inline">${cats.map((c) => `<label class="tag"><input type="checkbox" data-gcat="${i}" value="${esc(c.key)}" ${(g.catalogs || []).includes(c.key) ? "checked" : ""}> ${esc(c.title)}</label>`).join("")}</div></div>
      <button class="btn quiet small" data-gup="${i}" aria-label="Move section up" ${i === 0 ? "disabled" : ""}>↑</button><button class="btn quiet small" data-gdn="${i}" aria-label="Move section down" ${i === groups.length - 1 ? "disabled" : ""}>↓</button><button class="btn danger small" data-grm="${i}">Remove</button></div>`).join("") : `<p class="muted">No custom Home sections yet.</p>`;
    groups.forEach((g, i) => {
      const name = $(`#gn${i}`); name.onchange = () => { g.name = name.value.trim() || "My section"; save(); };
      Array.from(document.querySelectorAll("[data-gcat]")).filter((el) => Number(el.dataset.gcat) === i).forEach((c) => { c.onchange = () => { g.catalogs = Array.from(document.querySelectorAll("[data-gcat]")).filter((el) => Number(el.dataset.gcat) === i && el.checked).map((el) => el.value); save(); }; });
    });
    const moveGroup = (i, d) => { const j = i + d; [groups[i], groups[j]] = [groups[j], groups[i]]; save(); draw(); };
    $("#grouplist").querySelectorAll("[data-gup]").forEach((b) => b.onclick = () => moveGroup(Number(b.dataset.gup), -1));
    $("#grouplist").querySelectorAll("[data-gdn]").forEach((b) => b.onclick = () => moveGroup(Number(b.dataset.gdn), 1));
    $("#grouplist").querySelectorAll("[data-grm]").forEach((b) => b.onclick = () => { groups.splice(Number(b.dataset.grm), 1); profile.catalogGroups = groups; save(); draw(); });
  };
  $("#groupadd").onclick = () => { const name = $("#groupname").value.trim(); if (!name) { toast("Enter a section name first.", true); return; } profile.catalogGroups.push({ name, catalogs: [] }); save(); draw(); };
  draw();
}

function settingsData(box) {
  box.innerHTML = `
    <div class="note"><b>Your privacy.</b> There are no accounts, no tracking and no analytics. Everything is stored on this
    computer in <code>~/.config/bradflix/state.json</code>. The app only contacts the built-in metadata
    provider (for titles and artwork), the add-ons you added, and the servers of the videos you choose to play.</div>

    <h3>Sync between computers</h3>
    <div class="field"><label class="t" for="syncp">Sync file</label>
      <div class="inline"><input id="syncp" type="text" placeholder="~/Sync/wuplay.json" value="${esc(state.syncPath)}">
      <button class="btn" id="syncsave">Save</button><button class="btn quiet" id="syncnow">Sync now</button></div>
      <div class="hint">Pick a file inside a folder that Syncthing, Nextcloud, Dropbox or similar keeps in sync across your computers.
      BradsHub keeps your profiles, lists, history and progress in that file and picks up newer changes when it starts. Leave empty to turn off.
      The newest data wins, so avoid using two computers at the same moment.</div></div>

    <h3>Backup</h3>
    <div class="field"><label class="t" for="bkp">Backup file</label>
      <div class="inline"><input id="bkp" type="text" value="~/BradsHub-backup.json">
      <button class="btn" id="bexp">Export</button><button class="btn quiet" id="bimp">Import</button></div>
      <div class="hint">Export saves everything for all profiles. Import replaces what is here with the contents of that file.</div></div>

    <h3>Clean up</h3>
    <div class="btns"><button class="btn danger small" id="chist">Clear history</button>
      <button class="btn danger small" id="cprog">Clear watch progress</button>
      <button class="btn danger small" id="cwipe">Erase everything</button></div>
    <p class="muted">For safety, BradsHub's local management page is served only inside its own app window.</p>`;

  $("#syncsave").onclick = async () => {
    state.syncPath = $("#syncp").value.trim();
    save();
    if (state.syncPath) { await syncNow(true); showSettings("data"); } else toast("Sync turned off.");
  };
  $("#syncnow").onclick = async () => {
    if (!state.syncPath) { toast("Enter a sync file path first.", true); return; }
    const pulled = await syncNow(true);
    if (pulled) showProfiles(false);
  };
  $("#bexp").onclick = async () => {
    const res = await fetch("/api/file/write", { method: "POST", body: JSON.stringify({ path: $("#bkp").value, content: JSON.stringify(state, null, 1) }) });
    toast(res.ok ? "Backup saved." : "Could not save there. Use a full path ending in .json", !res.ok);
  };
  $("#bimp").onclick = async () => {
    const res = await fetch("/api/file/read", { method: "POST", body: JSON.stringify({ path: $("#bkp").value }) });
    if (!res.ok) { toast("Could not read that file.", true); return; }
    let data;
    try { data = JSON.parse((await res.json()).content); } catch (e) { toast("That file is not a BradsHub backup.", true); return; }
    if (!data || !Array.isArray(data.profiles)) { toast("That file is not a BradsHub backup.", true); return; }
    if (!(await confirmBox("Replace everything here with the backup?", "Replace"))) return;
    const keep = state.syncPath;
    state = migrate(data); state.syncPath = keep;
    save();
    showProfiles(false);
  };
  $("#chist").onclick = async () => { if (await confirmBox("Clear history for this profile?", "Clear")) { profile.history = []; save(); toast("History cleared."); } };
  $("#cprog").onclick = async () => { if (await confirmBox("Forget where you stopped in everything?", "Clear")) { profile.progress = {}; save(); toast("Progress cleared."); } };
  $("#cwipe").onclick = async () => {
    if (!(await confirmBox("Erase ALL profiles, lists, add-ons and history?", "Erase everything"))) return;
    const keep = state.syncPath;
    state = migrate({}); state.syncPath = keep;
    save();
    showProfiles(false);
  };
}

async function boot() {
  installKeyboardShortcuts();
  const intro = $("#intro");
  let introTimer = setTimeout(() => intro && intro.classList.add("done"), 3000);
  const skipIntro = () => { if (!intro || intro.classList.contains("done")) return; clearTimeout(introTimer); intro.classList.add("done"); document.removeEventListener("keydown", skipIntro); intro.removeEventListener("click", skipIntro); };
  document.addEventListener("keydown", skipIntro, { once: true });
  intro && intro.addEventListener("click", skipIntro, { once: true });
  document.querySelectorAll("#nav button").forEach((b) => { b.onclick = () => { if (profile) tab(b.dataset.go); }; });
  $("#chip").onclick = () => showProfiles(false);
  await loadState();
  applyTheme();
  await syncNow(false);
  applyTheme();
  if (state.profiles.length === 1 && !state.profiles[0].pin) enterProfile(state.profiles[0]);
  else showProfiles(false);
}
if (typeof window !== "undefined" && !window.__BRADFLIX_TEST__) boot();
